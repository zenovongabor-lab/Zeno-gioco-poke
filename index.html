async function loadProfile(u){
  ME={uid:u.uid, email:u.email, name:(u.email||"Trainer").split("@")[0], wins:0, losses:0};
  try{
    const snap=await FBdb.ref("users/"+u.uid).once("value");
    if(snap.exists()){ const d=snap.val()||{}; ME.name=d.name||ME.name; ME.wins=d.wins||0; ME.losses=d.losses||0; }
    else{ await FBdb.ref("users/"+u.uid).set({name:ME.name, wins:0, losses:0, created:Date.now()}); }

/* ============================================================
   ONLINE — Step 1: rooms + live presence (room codes)
   ============================================================ */
function genCode(){ const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s=""; for(let i=0;i<4;i++)s+=c[Math.floor(Math.random()*c.length)]; return s; }
function roomRef(code){ return FBdb.ref("rooms/"+code); }
function detachRoom(){ if(S.net&&S.net.ref){ try{ S.net.ref.off("value", S.net.cb); }catch(e){} S.net.ref=null; } }

async function createRoom(settings){
  if(!fbReady()||!ME) return;
  let code=genCode();
  try{
    // avoid a collision with an existing open room
    for(let t=0;t<5;t++){ const s=await roomRef(code).once("value"); if(!s.exists()) break; code=genCode(); }
    await roomRef(code).set({
      host:{uid:ME.uid,name:ME.name}, guest:null, phase:"lobby", created:Date.now(),
      settings: settings||null    // host's game settings apply to both players
    });
    S.net={code, role:"host", ref:null, room:null, cb:null};
    // if the host leaves, tear the room down
    roomRef(code).onDisconnect().remove();
    listenRoom(code);
  }catch(e){ S.netErr="Could not create a room. "+(e.message||""); render(); }
}
async function joinRoom(code){
  if(!fbReady()||!ME) return;
  code=(code||"").toUpperCase().trim();
  if(code.length!==4){ S.netErr="Enter the 4-character room code."; render(); return; }
  try{
    const snap=await roomRef(code).once("value");
    if(!snap.exists()){ S.netErr="No room with that code. Check it and try again."; render(); return; }
    const room=snap.val();
    if(room.guest && room.guest.uid && room.guest.uid!==ME.uid){ S.netErr="That room is already full."; render(); return; }
    await roomRef(code).child("guest").set({uid:ME.uid,name:ME.name});
    S.net={code, role:"guest", ref:null, room:null, cb:null};
    roomRef(code).child("guest").onDisconnect().remove();
    listenRoom(code);
  }catch(e){ S.netErr="Could not join: "+(e.message||""); render(); }
}
function listenRoom(code){
  detachRoom();
  const ref=roomRef(code);
  const cb=ref.on("value", snap=>{
    if(!S.net||S.net.code!==code) return;
    const room=snap.val();
    if(!room){ // room was deleted (host left)
      if(S.net.role==="guest"){ alert("The other trainer left the match."); }
      S.net=null; S.online=false; S.bt=null; S.screen="setup"; render(); return;
    }
    S.net.room=room;
    netOnRoomUpdate(room);
    if(S.screen==="online") render();
  });
  S.net.ref=ref; S.net.cb=cb;
}
async function leaveRoom(){
  S.online=false; S.bt=null;
  if(!S.net) { S.screen="setup"; render(); return; }
  const {code,role}=S.net; detachRoom();
  try{
    if(role==="host") await roomRef(code).remove();
    else await roomRef(code).child("guest").remove();
  }catch(e){}
  S.net=null; S.screen="setup"; render();
}

             + (net.role==="host"
                ? `<button class="btn" id="onStart" style="margin-top:6px">Start — draft &amp; battle!</button>`
                : `<p class="on-sub" style="text-align:center">Waiting for <b>${escapeHtml(hn)}</b> to start the match…</p>`)
          : `<p class="on-sub" style="text-align:center">Tell your friend to tap <b>Play Online → Join a room</b> and enter this code.</p>`}
        <button class="btn ghost" id="onLeave" style="margin-top:10px">Leave room</button>
      </div>`;
  }
  app.innerHTML=`
    <div class="online">
      <button class="acbtn" id="onBack" style="margin-bottom:12px">← Back</button>
      <h2 class="disp" style="text-align:center;margin:4px 0 14px">🌐 Play Online</h2>
      ${body}
    </div>`;
  const bk=$("onBack"); if(bk) bk.onclick=()=>{ if(S.net) leaveRoom(); else { S.screen="setup"; render(); } };
  const c=$("onCreate"); if(c) c.onclick=()=>{ S.netErr=""; createRoom(); };
  const j=$("onJoin"); if(j) j.onclick=()=>{ S.netErr=""; joinRoom($("onJoinCode").value); };
  const lv=$("onLeave"); if(lv) lv.onclick=leaveRoom;
  const st=$("onStart"); if(st) st.onclick=()=>{ roomRef(net.code).child("phase").set("draft"); };
}

/* ============================================================
   ONLINE — Step 2: live battle (host-authoritative, turn-synced)
   ============================================================ */
function compactTeam(team){ return team.map(m=>({name:m.name,id:m.id,display:m.display,types:m.types,
  stats:m.stats,ability:m.ability||null,item:m.item||null,shiny:!!m.shiny,mega:!!m.mega,gmax:!!m.gmax,
  variant:m.variant||"",baseStats:m.baseStats||null,bst:m.bst||0})); }
const reviveMon=c=>({...c, types:c.types||[]});

// The brain: react to room changes and drive the phases.
function netOnRoomUpdate(room){
  if(!room||!S.net) return;
  const role=S.net.role, prev=S.net.phase; S.net.phase=room.phase;
  // entering a fresh draft (first match OR a rematch) resets per-match flags
  if(room.phase==="draft" && prev!=="draft"){ S.net.started=false; S.net.battleInit=false; S.bt=null; }
  if(room.phase==="draft" && !S.net.started){ S.net.started=true; startOnlineDraft(room); return; }
  if(role==="host" && room.phase==="draft" && room.ready && room.ready.host && room.ready.guest && !S.net.battleInit){
    S.net.battleInit=true; netHostInitBattle(room); return;
  }
  if(room.phase==="battle" || room.phase==="over"){
    if(role==="guest" && !S.net.battleInit && room.state){ S.net.battleInit=true; netGuestInitBattle(room); return; }
    if(role==="host" && S.bt && S.bt.online && !S.bt.over){
      const ga=room.actions&&room.actions.guest;
      if(ga && ga.turn===S.bt.turnNo && !S.bt.oppAction){
        S.bt.oppAction={type:ga.type||"move", idx:ga.idx, to:ga.to}; netHostTryResolve();
      }
    }
    if(role==="guest" && S.bt && room.state && room.state.turnNo!==S.bt.turnNo){ netApplyState(room.state); }
  }
  // rematch: when both trainers ask, the host restarts the room into a new draft
  if(room.phase==="over" && role==="host" && room.rematch && room.rematch.host && room.rematch.guest && !S.net.rematching){
    S.net.rematching=true; netHostRematch();
  }
}
async function netHostRematch(){
  try{ await roomRef(S.net.code).update({ phase:"draft", teams:null, ready:null, state:null, actions:null, rematch:null }); }catch(e){}
  S.net.rematching=false;
}
async function netAskRematch(){
  if(!S.net) return;
  try{ await roomRef(S.net.code).child("rematch/"+S.net.role).set(true); }catch(e){}
  const b=$("netRematch"); if(b){ b.disabled=true; b.textContent="Waiting for opponent…"; }
}
async function startOnlineDraft(room){
  S.online=true;
  // both players use the HOST's chosen settings so the draft is fair
  const st=room.settings;
  if(st){ S.region=st.region||0; S.noLegendaries=!!st.noLegendaries; S.drawStyle=st.drawStyle||"fair";
          S.noGoPerRound=(st.noGoPerRound!=null?st.noGoPerRound:1); S.shinyRate=st.shinyRate||shinyRateFor(S.drawStyle); }
  S.battleMode=true;
  const meName=(S.net.role==="host"?room.host.name:(room.guest&&room.guest.name))||ME.name;
  const oppName=(S.net.role==="host"?(room.guest&&room.guest.name):room.host.name)||"Opponent";
  S.p1name=meName;
  S.players=[{name:meName,ai:false,team:[],noGoRoundLeft:0},{name:oppName,ai:false,team:[],noGoRoundLeft:0}];
  S.round=1; S.cur=0; S.screen="game";
  if(!S.pokedex.length){ await loadData(); }
  computePool(); render(); beginTurn();
}
async function submitOnlineTeam(){
  const role=S.net.role;
  S.screen="netwait";
  $("app").innerHTML=`<div style="text-align:center;padding:70px 10px"><div class="spinner"></div>
    <p class="loadline">Team sent! Waiting for the other trainer…</p></div>`;
  try{
    await roomRef(S.net.code).child("teams/"+role).set(compactTeam(S.players[0].team));
    await roomRef(S.net.code).child("ready/"+role).set(true);
  }catch(e){ alert("Could not send team: "+(e.message||"")); }
}
function netHostInitBattle(room){
  const A=(room.teams.host||[]).map(reviveMon), B=(room.teams.guest||[]).map(reviveMon);
  S.bt={ teams:[A.map(makeBattler), B.map(makeBattler)], names:[room.host.name, (room.guest&&room.guest.name)||"Rival"],
         ai:[false,false], active:[0,0], log:[], recap:[], busy:false, over:false, winner:-1,
         online:true, host:true, weather:null, turnNo:1, myAction:null, oppAction:null, clawMsg:null };
  S.screen="battle"; renderBattle();
  pushLog(`<span class="muted">Online battle! ${escapeHtml(S.bt.names[0])} vs ${escapeHtml(S.bt.names[1])}.</span>`);
  const order=eStat(activeB(0),"spe")>=eStat(activeB(1),"spe")?[0,1]:[1,0];
  for(const s of order){ onEntry(s); }
  paintPanel(0); paintPanel(1); paintWeather();
  netWriteState(); setPromptOnline();
}
function netGuestInitBattle(room){
  const A=(room.teams.host||[]).map(reviveMon), B=(room.teams.guest||[]).map(reviveMon);
  S.bt={ teams:[B.map(makeBattler), A.map(makeBattler)], names:[(room.guest&&room.guest.name)||"You", room.host.name],
         ai:[false,false], active:[0,0], log:[], recap:[], busy:false, over:false, winner:-1,
         online:true, host:false, weather:null, turnNo:0, pendingAction:false };
  S.screen="battle"; renderBattle();
  if(room.state) netApplyState(room.state);
}
function netSerialize(){
  const bt=S.bt;
  const sd=side=>({active:bt.active[side], mons:bt.teams[side].map(x=>({hp:Math.max(0,Math.ceil(x.hp)),
      max:x.max, status:x.status||null, fainted:!!x.fainted, stages:x.stages||{}}))});
  const over=!!bt.over;
  return { host:sd(0), guest:sd(1), weather:bt.weather?bt.weather.kind:null,
           log:(bt.log||[]).slice(-4), over, winner: over?(bt.winner===0?"host":"guest"):null, turnNo:bt.turnNo };
}
async function netWriteState(){
  if(!S.net) return;
  const st=netSerialize();
  try{ await roomRef(S.net.code).update({ state:st, phase: st.over?"over":"battle", "actions/guest":null }); }catch(e){}
}
function netApplyState(state){
  const bt=S.bt; if(!bt||!state) return;
  const put=(side,sd)=>{ if(!sd) return; bt.active[side]=sd.active||0;
    (sd.mons||[]).forEach((m,i)=>{ const b=bt.teams[side][i]; if(b){ b.hp=m.hp; b.max=m.max||b.max; b.status=m.status||null; b.fainted=!!m.fainted; if(m.stages)b.stages=m.stages; } }); };
  put(0, state.guest); put(1, state.host);   // guest views itself (state.guest) as side 0
  bt.weather = state.weather?{kind:state.weather,turns:5}:null;
  bt.log = state.log||[]; bt.turnNo = state.turnNo; bt.pendingAction=false;
  if(state.over){ bt.over=true; bt.winner=(state.winner==="guest")?0:1; }
  paintPanel(0); paintPanel(1); renderLog(); paintWeather(); updateCount();
  if(state.over){ netShowResult(); return; }
  renderMoves();
}
function setPromptOnline(){ if(!S.bt||S.bt.over) return;
  S.bt.log=[`What will <b>${escapeHtml(activeB(0).mon.display)}</b> do?`]; renderLog(); renderMoves(); }
const normAct=a=>(typeof a==="number")?{type:"move",idx:a}:a;
function netHostPick(a){ const bt=S.bt; if(!bt||bt.busy||bt.over||bt.myAction) return; bt.myAction=normAct(a); renderMoves(); netHostTryResolve(); }
async function netGuestPick(a){ const bt=S.bt; if(!bt||bt.over||bt.pendingAction) return;
  bt.pendingAction=true; renderMoves();
  try{ await roomRef(S.net.code).child("actions/guest").set({turn:bt.turnNo, ...normAct(a)}); }
  catch(e){ bt.pendingAction=false; renderMoves(); } }
function netHostTryResolve(){ const bt=S.bt; if(!bt||!bt.host||bt.busy||bt.over) return;
  if(bt.myAction && bt.oppAction){ netHostResolveTurn(bt.myAction, bt.oppAction); } }
function netDoSwitch(side,to){
  const bt=S.bt, out=activeB(side); if(to==null||to===bt.active[side]||bt.teams[side][to].fainted) return false;
  out.entered=false; out.flashfire=false; bt.active[side]=to;
  pushLog(`<span class="muted">${escapeHtml(bt.names[side])} sent out ${escapeHtml(activeB(side).mon.display)}!</span>`);
  return true;
}
async function netHostResolveTurn(a0,a1){
  const bt=S.bt; if(bt.busy||bt.over) return; bt.busy=true; bt.myAction=null; bt.oppAction=null; renderMoves();
  // 1) switches resolve first (both), entry abilities in speed order
  const switched=[];
  if(a0 && a0.type==="switch" && netDoSwitch(0,a0.to)) switched.push(0);
  if(a1 && a1.type==="switch" && netDoSwitch(1,a1.to)) switched.push(1);
  if(switched.length){ paintPanel(0); paintPanel(1); await wait(650);
    const ord = switched.length===2 ? (eStat(activeB(0),"spe")>=eStat(activeB(1),"spe")?[0,1]:[1,0]) : switched;
    for(const s of ord){ await onEntryAnim(s); }
  }
  // 2) attacks — only the sides that chose a move
  const you=activeB(0), foe=activeB(1);
  const m0 = (a0&&a0.type==="move") ? (you.moves[a0.idx]||you.moves[0]) : null;
  const m1 = (a1&&a1.type==="move") ? (foe.moves[a1.idx]||foe.moves[0]) : null;
  let movers=[];
  if(m0) movers.push({side:0,atk:you,def:foe,mv:m0});
  if(m1) movers.push({side:1,atk:foe,def:you,mv:m1});
  if(movers.length===2){
    const A=movers[0],B=movers[1], pA=prio(A.atk,A.mv), pB=prio(B.atk,B.mv);
    let bFirst;
    if(pA!==pB) bFirst=pB>pA;
    else { const sA=eStat(A.atk,"spe"), sB=eStat(B.atk,"spe"); bFirst=sB>sA||(sB===sA&&Math.random()<.5);
      if(!bFirst && A.atk.item==="claw" && Math.random()<0.2){} else if(bFirst && B.atk.item==="claw"){} }
    if(bFirst) movers.reverse();
  }
  for(const mo of movers){ if(mo.atk.fainted||mo.def.fainted) continue;
    const can=await canAct(mo.side,mo.atk); if(!can){ if(bt.over)break; continue; }
    await performMove(mo.side,mo.atk,mo.def,mo.mv); if(bt.over) break; }
  activeB(0).flinched=false; activeB(1).flinched=false;
  if(!bt.over) await endOfTurn();
  if(!bt.over) await handleFaints();
  bt.busy=false; bt.turnNo=(bt.turnNo||1)+1;
  await netWriteState();
  if(bt.over){ netShowResult(); return; }
  paintPanel(0); paintPanel(1); updateCount(); setPromptOnline();
}
function netShowResult(){
  const bt=S.bt; if(!bt||bt.resultShown) return; bt.resultShown=true;
  const iWon=bt.winner===0; recordResult(iWon); sfxWin(); if(iWon) confetti();
  $("app").innerHTML=`
    <div class="results">
      <div style="font-family:var(--display);color:var(--muted);letter-spacing:2px;font-size:13px">— ONLINE MATCH —</div>
      <div class="winner">${iWon?"🏆 You win!":"You lost…"}</div>
      <div style="color:var(--muted);font-size:14px">vs ${escapeHtml(bt.names[1])}</div>
      ${ME?`<div style="color:var(--yellow);font-family:var(--mono);margin-top:8px">Record: ${ME.wins}W – ${ME.losses}L</div>`:""}
      <button class="btn" id="netRematch" style="margin-top:18px">🔁 Rematch</button>
      <button class="btn ghost" id="netDone" style="margin-top:10px">Back to menu</button>
    </div>`;
  const r=$("netRematch"); if(r) r.onclick=netAskRematch;
  const d=$("netDone"); if(d) d.onclick=leaveRoom;
}

/* ---------- boot ---------- */
initFirebase();
render();
loadData(); // warm up in background
</script>
</body>
