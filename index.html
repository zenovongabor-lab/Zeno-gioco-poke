<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Poké Draft Duel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --night:#141235; --night2:#211c4d; --panel:#2a2560; --panel2:#332b74;
  --red:#ee2b3a; --red-d:#b81f2c; --yellow:#ffcb05; --ink:#0b0a24;
  --white:#f6f5ff; --muted:#a49ede; --line:rgba(255,255,255,.10);
  --good:#37d67a; --slot:rgba(255,255,255,.06);
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --pixel:'Press Start 2P','Courier New',monospace;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--white);
  background:
    radial-gradient(1200px 600px at 50% -10%, #3a2f8a 0%, transparent 60%),
    radial-gradient(900px 500px at 90% 110%, #4a1f5e 0%, transparent 55%),
    linear-gradient(180deg,var(--night) 0%, var(--night2) 100%);
  background-attachment:fixed;
  min-height:100%;
  overflow-x:hidden;
}
h1,h2,h3,.disp{font-family:var(--display);letter-spacing:.5px}
.mono{font-family:var(--mono)}
.app{max-width:720px;margin:0 auto;padding:16px 14px 40px;min-height:100vh}

/* ---------- shared ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-weight:600;font-size:13px}
.btn{
  font-family:var(--display);font-weight:600;border:none;cursor:pointer;
  border-radius:16px;padding:15px 20px;font-size:17px;color:#fff;
  background:linear-gradient(180deg,var(--red),var(--red-d));
  box-shadow:0 6px 0 #7c1420, 0 10px 22px rgba(0,0,0,.35);
  transition:transform .08s ease, box-shadow .08s ease;
  width:100%;
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #7c1420,0 6px 14px rgba(0,0,0,.35)}
.btn:disabled{opacity:.45;filter:grayscale(.4);cursor:not-allowed}
.btn.ghost{
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  box-shadow:0 6px 0 #1a1640,0 10px 20px rgba(0,0,0,.3);
}
.btn.ghost:active{box-shadow:0 2px 0 #1a1640,0 6px 14px rgba(0,0,0,.3)}
.card-surface{
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  border:1px solid var(--line);border-radius:22px;
}

/* ---------- setup ---------- */
.hero{text-align:center;padding:14px 6px 6px}
.hero h1{font-size:40px;line-height:1;margin:14px 0 4px;
  background:linear-gradient(180deg,#fff 30%, var(--yellow) 130%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.hero p{color:var(--muted);margin:0 0 6px;font-size:15px}
.setup{margin-top:14px;padding:18px 16px}
.field{margin-bottom:20px}
.field > label{display:block;font-family:var(--display);font-weight:600;font-size:15px;margin-bottom:10px;color:var(--white)}
.field .hint{color:var(--muted);font-weight:400;font-size:12.5px;font-family:system-ui}
.choices{display:flex;gap:10px;flex-wrap:wrap}
.chip{
  flex:1 1 0;min-width:96px;text-align:center;cursor:pointer;user-select:none;
  border:1.5px solid var(--line);border-radius:14px;padding:12px 8px;
  background:var(--slot);font-family:var(--display);font-weight:600;font-size:15px;
  transition:.12s;color:var(--muted)
}
.chip.on{border-color:var(--yellow);color:#fff;background:linear-gradient(180deg,rgba(255,203,5,.18),rgba(255,203,5,.05));box-shadow:0 0 0 3px rgba(255,203,5,.12)}
.chip small{display:block;font-family:system-ui;font-weight:400;font-size:11px;color:var(--muted);margin-top:3px}
.choices.wrap{flex-wrap:wrap}
.chip.sm{flex:0 1 auto;min-width:66px;padding:9px 12px;font-size:14px}
.chip .gen{display:block;font-family:var(--mono);font-weight:400;font-size:9.5px;color:var(--muted);margin-top:2px}
.chip.sm.on .gen{color:var(--yellow)}
.names{display:flex;gap:10px}
.names input{
  flex:1;background:var(--slot);border:1.5px solid var(--line);border-radius:12px;
  color:#fff;padding:12px;font-size:15px;font-family:system-ui;min-width:0;
}
.names input:focus{outline:none;border-color:var(--yellow)}

/* ---------- accounts (login bar + modal) ---------- */
.acctbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--slot);border:1px solid var(--line);border-radius:14px;
  padding:8px 12px;margin-bottom:10px;font-size:13.5px}
.acctbar.off{color:var(--muted);justify-content:center}
.acctbar .who{font-family:var(--display);font-weight:600}
.acctbar .rec{font-family:var(--mono);font-size:12px;color:var(--yellow)}
.acctbar .acbtn{margin-left:auto;background:var(--slot);border:1px solid var(--line);color:var(--white);
  border-radius:10px;padding:7px 12px;font-family:var(--display);font-weight:600;font-size:13px;cursor:pointer}
.acctbar .acbtn.primary{background:linear-gradient(180deg,var(--red),var(--red-d));border:none;box-shadow:0 3px 0 #7c1420}
.modal-back{position:fixed;inset:0;background:rgba(8,6,26,.72);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;z-index:60;padding:18px}
.modal-back.show{display:flex;animation:fade .2s ease}
.acct{width:100%;max-width:340px;border-radius:22px;padding:18px 16px;
  background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
  box-shadow:0 24px 60px rgba(0,0,0,.6)}
.acct-tabs{display:flex;gap:8px;margin-bottom:14px}
.acct-tab{flex:1;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--slot);
  color:var(--muted);font-family:var(--display);font-weight:600;font-size:15px;cursor:pointer;text-align:center}
.acct-tab.on{border-color:var(--yellow);color:#fff;background:linear-gradient(180deg,rgba(255,203,5,.18),rgba(255,203,5,.05))}
.acct-in{width:100%;background:var(--slot);border:1.5px solid var(--line);border-radius:12px;
  color:#fff;padding:12px;font-size:15px;font-family:system-ui;margin-bottom:10px}
.acct-in:focus{outline:none;border-color:var(--yellow)}
.acct-err{color:#ff8a8a;font-size:13px;min-height:18px;margin-bottom:6px;text-align:center}

/* ---------- online lobby ---------- */
.online{max-width:460px;margin:0 auto;padding-top:6px}
.on-card{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.on-title{font-family:var(--display);font-weight:700;font-size:18px;margin-bottom:4px}
.on-sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.on-or{text-align:center;color:var(--muted);font-family:var(--display);margin:6px 0 12px}
.on-code{width:100%;text-align:center;letter-spacing:8px;text-transform:uppercase;
  background:var(--slot);border:1.5px solid var(--line);border-radius:12px;color:#fff;
  padding:12px;font-size:26px;font-family:var(--mono);margin-bottom:10px}
.on-code:focus{outline:none;border-color:var(--yellow)}
.on-bigcode{text-align:center;font-family:var(--mono);font-weight:700;font-size:44px;letter-spacing:10px;
  color:var(--yellow);margin:6px 0 14px;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.on-players{display:flex;flex-direction:column;gap:8px;margin:6px 0}
.on-player{display:flex;align-items:center;gap:9px;background:var(--slot);border:1px solid var(--line);
  border-radius:12px;padding:11px 13px;font-family:var(--display);font-weight:600;color:var(--muted)}
.on-player.on{color:#fff;border-color:rgba(55,214,122,.4)}
.on-player .dot{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.2)}
.on-player .dot.on{background:var(--good);box-shadow:0 0 8px var(--good)}
.on-ready{text-align:center;font-family:var(--display);font-weight:700;color:var(--good);font-size:17px;margin:12px 0 6px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="modal-back" id="acctBack"><div id="acctHost"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const FIREBASE_CONFIG={
  apiKey:"AIzaSyBkF-nWHpRBNAMY8l4sYveRYgQJ660W_c0",
  authDomain:"poke-draft-duel.firebaseapp.com",
  databaseURL:"https://poke-draft-duel-default-rtdb.firebaseio.com",
  projectId:"poke-draft-duel",
  storageBucket:"poke-draft-duel.firebasestorage.app",
  messagingSenderId:"1049793894037",
  appId:"1:1049793894037:web:b77c13255bf7bc59e76d9c"
};

if (!firebase.apps.length) {
  firebase.initializeApp(FIREBASE_CONFIG);
}
const FBauth = firebase.auth();
const FBdb = firebase.database();

let currentUser = null;
let acctTab = 'login';
let acctErr = '';

FBauth.onAuthStateChanged(user => {
  currentUser = user;
  if(user && user.displayName) {
    state.p1Name = user.displayName;
  }
  render();
});

let state = {
  view: 'setup',
  p2Mode: 'ai',
  reroll: 1,
  ending: 'battle',
  drawStyle: 'pair',
  regions: [1,2,3,4,5,6,7,8,9],
  legendaries: 'include',
  p1Name: 'DiaMorda',
  p2Name: 'AI Rival',
  roomCode: null,
  isHost: false,
  roomData: null
};

const REGIONS = [
  { id: 1, name: 'Kanto', gen: 'Gen 1' },
  { id: 2, name: 'Johto', gen: 'Gen 2' },
  { id: 3, name: 'Hoenn', gen: 'Gen 3' },
  { id: 4, name: 'Sinnoh', gen: 'Gen 4' },
  { id: 5, name: 'Unova', gen: 'Gen 5' },
  { id: 6, name: 'Kalos', gen: 'Gen 6' },
  { id: 7, name: 'Alola', gen: 'Gen 7' },
  { id: 8, name: 'Galar', gen: 'Gen 8' },
  { id: 9, name: 'Paldea', gen: 'Gen 9' }
];

function render() {
  const app = document.getElementById('app');
  if (state.view === 'setup') {
    app.innerHTML = renderAccountBar() + renderSetup();
  } else if (state.view === 'online') {
    app.innerHTML = renderOnline();
  }
  renderAccountModal();
}

function renderAccountBar() {
  if (currentUser) {
    return `
      <div class="acctbar">
        <span>Logged in as <b class="who">${currentUser.displayName || currentUser.email}</b></span>
        <button class="acbtn" onclick="logout()">Log out</button>
      </div>
    `;
  }
  return `
    <div class="acctbar off">
      <span>Play as Guest or</span>
      <button class="acbtn primary" onclick="showAcctModal(true)">Log in / Sign up</button>
    </div>
  `;
}

function renderAccountModal() {
  const host = document.getElementById('acctHost');
  if (!host) return;
  host.innerHTML = `
    <div class="acct">
      <div class="acct-tabs">
        <div class="acct-tab ${acctTab==='login'?'on':''}" onclick="setAcctTab('login')">Log In</div>
        <div class="acct-tab ${acctTab==='signup'?'on':''}" onclick="setAcctTab('signup')">Sign Up</div>
      </div>
      ${acctErr ? `<div class="acct-err">${acctErr}</div>` : ''}
      ${acctTab === 'signup' ? `<input type="text" id="acctName" class="acct-in" placeholder="Trainer Name">` : ''}
      <input type="email" id="acctEmail" class="acct-in" placeholder="Email address">
      <input type="password" id="acctPass" class="acct-in" placeholder="Password">
      <button class="btn" onclick="handleAcctSubmit()">${acctTab === 'login' ? 'Log In' : 'Create Account'}</button>
      <button class="btn ghost" style="margin-top:8px;" onclick="showAcctModal(false)">Cancel</button>
    </div>
  `;
}

function showAcctModal(show) {
  const el = document.getElementById('acctBack');
  if(show) el.classList.add('show');
  else el.classList.remove('show');
}

function setAcctTab(tab) {
  acctTab = tab;
  acctErr = '';
  renderAccountModal();
}

function handleAcctSubmit() {
  const email = document.getElementById('acctEmail').value;
  const pass = document.getElementById('acctPass').value;
  acctErr = '';

  if (acctTab === 'login') {
    FBauth.signInWithEmailAndPassword(email, pass)
      .then(() => showAcctModal(false))
      .catch(err => { acctErr = err.message; renderAccountModal(); });
  } else {
    const name = document.getElementById('acctName').value;
    FBauth.createUserWithEmailAndPassword(email, pass)
      .then(res => {
        return res.user.updateProfile({ displayName: name });
      })
      .then(() => showAcctModal(false))
      .catch(err => { acctErr = err.message; renderAccountModal(); });
  }
}

function logout() {
  FBauth.signOut();
}

function renderSetup() {
  return `
    <div class="hero">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span class="pill" style="background:rgba(255,255,255,.08)">DiaMorda • Vol. 1</span>
        <button class="btn ghost" style="width:auto;padding:6px 14px;font-size:13px;" onclick="openOnlineView()">Play Online</button>
      </div>
      <h1>Poké Draft Duel</h1>
      <p>Crack open mystery balls. Draft a team of six. Duel your rival.</p>
    </div>
    <div class="setup card-surface">
      <div class="field">
        <label>Player 2 <span class="hint">who drafts second?</span></label>
        <div class="choices">
          <div class="chip ${state.p2Mode==='ai'?'on':''}" onclick="setOption('p2Mode','ai')">AI Rival<small>Auto-drafts</small></div>
          <div class="chip ${state.p2Mode==='human'?'on':''}" onclick="setOption('p2Mode','human')">Human<small>Pass & play</small></div>
        </div>
      </div>
      <div class="field">
        <label>No reroll <span class="hint">once per round, per player</span></label>
        <div class="choices">
          <div class="chip ${state.reroll===0?'on':''}" onclick="setOption('reroll',0)">Off<small>No rerolls</small></div>
          <div class="chip ${state.reroll===1?'on':''}" onclick="setOption('reroll',1)">1 / round<small>Recommended</small></div>
          <div class="chip ${state.reroll===2?'on':''}" onclick="setOption('reroll',2)">2 / round<small>Generous</small></div>
        </div>
      </div>
      <div class="field">
        <label>Ending <span class="hint">how the start is decided</span></label>
        <div class="choices">
          <div class="chip ${state.ending==='battle'?'on':''}" onclick="setOption('ending','battle')">Battle<small>Teams fight it out</small></div>
          <div class="chip ${state.ending==='power'?'on':''}" onclick="setOption('ending','power')">Power total<small>Highest stats win</small></div>
        </div>
      </div>
      <div class="field">
        <label>Draw style <span class="hint">how the balls are shown</span></label>
        <div class="choices">
          <div class="chip ${state.drawStyle==='pair'?'on':''}" onclick="setOption('drawStyle','pair')">Pair<small>+2 strong, -1 weaker</small></div>
          <div class="chip ${state.drawStyle==='classic'?'on':''}" onclick="setOption('drawStyle','classic')">Classic<small>Natural stats</small></div>
          <div class="chip ${state.drawStyle==='chaos'?'on':''}" onclick="setOption('drawStyle','chaos')">Chaos<small>Anything, anytime</small></div>
        </div>
      </div>
      <div class="field">
        <label>Region <span class="hint">which generations to draft from</span></label>
        <div class="choices wrap">
          <div class="chip sm ${state.regions.length===9?'on':''}" onclick="toggleAllRegions()">All<span class="gen">Gen 1 - 9</span></div>
          ${REGIONS.map(r => `
            <div class="chip sm ${state.regions.includes(r.id)?'on':''}" onclick="toggleRegion(${r.id})">${r.name}<span class="gen">${r.gen}</span></div>
          `).join('')}
        </div>
      </div>
      <div class="field">
        <label>Legendaries <span class="hint">include the big rare ones?</span></label>
        <div class="choices">
          <div class="chip ${state.legendaries==='include'?'on':''}" onclick="setOption('legendaries','include')">Include<small>Legends in play</small></div>
          <div class="chip ${state.legendaries==='exclude'?'on':''}" onclick="setOption('legendaries','exclude')">Exclude<small>Kicked drafted</small></div>
        </div>
      </div>
      <div class="field">
        <label>Trainer names <span class="hint">optional</span></label>
        <div class="names">
          <input type="text" value="${state.p1Name}" oninput="state.p1Name=this.value">
          <input type="text" value="${state.p2Name}" oninput="state.p2Name=this.value">
        </div>
      </div>
      <button class="btn" onclick="openOnlineView()">Start Duel</button>
    </div>
  `;
}

function renderOnline() {
  const room = state.roomData;
  return `
    <div class="online">
      <button class="btn ghost" style="width:auto;margin-bottom:12px;padding:8px 16px;" onclick="leaveRoom()">← Back</button>
      <div class="on-card text-center">
        <div class="on-title">Play Online</div>
        ${!state.roomCode ? `
          <div class="on-sub">Make a room and share the code with your friend.</div>
          <button class="btn" onclick="createOnlineRoom()">Create room</button>
          <div class="on-or">or</div>
          <div class="on-sub">Enter the code your friend gave you.</div>
          <input type="text" class="on-code" id="joinInput" maxlength="4" placeholder="ABCD">
          <button class="btn ghost" onclick="joinOnlineRoom()">Join</button>
        ` : `
          <div class="on-sub">Room code - Share this:</div>
          <div class="on-bigcode">${state.roomCode}</div>
          <div class="on-players">
            <div class="on-player ${room && room.host ? 'on':''}">
              <span class="dot ${room && room.host ? 'on':''}"></span>
              ${room && room.host ? room.host.name : 'Waiting...'} ${state.isHost ? '(you)' : ''}
            </div>
            <div class="on-player ${room && room.guest ? 'on':''}">
              <span class="dot ${room && room.guest ? 'on':''}"></span>
              ${room && room.guest ? room.guest.name : 'Waiting for a friend...'} ${!state.isHost && room && room.guest ? '(you)' : ''}
            </div>
          </div>
          ${room && room.host && room.guest ? `
            <div class="on-ready">Both trainers connected!</div>
          ` : ''}
          <button class="btn ghost" style="margin-top:14px" onclick="leaveRoom()">Leave room</button>
        `}
      </div>
    </div>
  `;
}

function setOption(key, val) { state[key] = val; render(); }
function toggleRegion(id) {
  if (state.regions.includes(id)) state.regions = state.regions.filter(r => r !== id);
  else state.regions.push(id);
  render();
}
function toggleAllRegions() {
  if (state.regions.length === 9) state.regions = [];
  else state.regions = [1,2,3,4,5,6,7,8,9];
  render();
}
function openOnlineView() { state.view = 'online'; render(); }
function leaveRoom() {
  if (state.roomCode) FBdb.ref('rooms/' + state.roomCode).off();
  state.roomCode = null; state.roomData = null; state.isHost = false; state.view = 'setup';
  render();
}
function createOnlineRoom() {
  const code = Math.random().toString(36).substring(2, 6).toUpperCase();
  state.roomCode = code; state.isHost = true;
  FBdb.ref('rooms/' + code).set({ host: { name: state.p1Name } });
  listenToRoom(code);
}
function joinOnlineRoom() {
  const input = document.getElementById('joinInput');
  if (!input || !input.value) return;
  const code = input.value.toUpperCase();
  const roomRef = FBdb.ref('rooms/' + code);
  roomRef.once('value', snapshot => {
    if (snapshot.exists()) {
      state.roomCode = code; state.isHost = false; state.p2Name = "Zeno Pressione";
      roomRef.child('guest').set({ name: state.p2Name });
      listenToRoom(code);
    } else { alert("Room not found!"); }
  });
}
function listenToRoom(code) {
  FBdb.ref('rooms/' + code).on('value', snapshot => {
    const data = snapshot.val();
    if (!data) return;
    state.roomData = data;
    render();
  });
}

render();
</script>
</body>
</html>
