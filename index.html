<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Poké Draft Duel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --night:#141235; --night2:#211c4d; --panel:#2a2560; --panel2:#332b74;
  --red:#ee2b3a; --red-d:#b81f2c; --yellow:#ffcb05; --ink:#0b0a24;
  --white:#f6f5ff; --muted:#a49ede; --line:rgba(255,255,255,.10);
  --good:#37d67a; --slot:rgba(255,255,255,.06);
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --pixel:'Press Start 2P','Courier New',monospace;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--white);
  background:
    radial-gradient(1200px 600px at 50% -10%, #3a2f8a 0%, transparent 60%),
    radial-gradient(900px 500px at 90% 110%, #4a1f5e 0%, transparent 55%),
    linear-gradient(180deg,var(--night) 0%, var(--night2) 100%);
  background-attachment:fixed;
  min-height:100%;
  overflow-x:hidden;
}
h1,h2,h3,.disp{font-family:var(--display);letter-spacing:.5px}
.mono{font-family:var(--mono)}
.app{max-width:720px;margin:0 auto;padding:16px 14px 40px;min-height:100vh}

/* ---------- shared ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-weight:600;font-size:13px}
.btn{
  font-family:var(--display);font-weight:600;border:none;cursor:pointer;
  border-radius:16px;padding:15px 20px;font-size:17px;color:#fff;
  background:linear-gradient(180deg,var(--red),var(--red-d));
  box-shadow:0 6px 0 #7c1420, 0 10px 22px rgba(0,0,0,.35);
  transition:transform .08s ease, box-shadow .08s ease;
  width:100%;
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #7c1420,0 6px 14px rgba(0,0,0,.35)}
.btn:disabled{opacity:.45;filter:grayscale(.4);cursor:not-allowed}
.btn.ghost{
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  box-shadow:0 6px 0 #1a1640,0 10px 20px rgba(0,0,0,.3);
}
.btn.ghost:active{box-shadow:0 2px 0 #1a1640,0 6px 14px rgba(0,0,0,.3)}
.card-surface{
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  border:1px solid var(--line);border-radius:22px;
}

/* ---------- setup ---------- */
.hero{text-align:center;padding:14px 6px 6px}
.hero h1{font-size:40px;line-height:1;margin:14px 0 4px;
  background:linear-gradient(180deg,#fff 30%, var(--yellow) 130%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.hero p{color:var(--muted);margin:0 0 6px;font-size:15px}
.setup{margin-top:14px;padding:18px 16px}
.field{margin-bottom:20px}
.field > label{display:block;font-family:var(--display);font-weight:600;font-size:15px;margin-bottom:10px;color:var(--white)}
.field .hint{color:var(--muted);font-weight:400;font-size:12.5px;font-family:system-ui}
.choices{display:flex;gap:10px;flex-wrap:wrap}
.chip{
  flex:1 1 0;min-width:96px;text-align:center;cursor:pointer;user-select:none;
  border:1.5px solid var(--line);border-radius:14px;padding:12px 8px;
  background:var(--slot);font-family:var(--display);font-weight:600;font-size:15px;
  transition:.12s;color:var(--muted)
}
.chip.on{border-color:var(--yellow);color:#fff;background:linear-gradient(180deg,rgba(255,203,5,.18),rgba(255,203,5,.05));box-shadow:0 0 0 3px rgba(255,203,5,.12)}
.chip small{display:block;font-family:system-ui;font-weight:400;font-size:11px;color:var(--muted);margin-top:3px}
.choices.wrap{flex-wrap:wrap}
.chip.sm{flex:0 1 auto;min-width:66px;padding:9px 12px;font-size:14px}
.chip .gen{display:block;font-family:var(--mono);font-weight:400;font-size:9.5px;color:var(--muted);margin-top:2px}
.chip.sm.on .gen{color:var(--yellow)}
.names{display:flex;gap:10px}
.names input{
  flex:1;background:var(--slot);border:1.5px solid var(--line);border-radius:12px;
  color:#fff;padding:12px;font-size:15px;font-family:system-ui;min-width:0;
}
.names input:focus{outline:none;border-color:var(--yellow)}
.loadline{color:var(--muted);font-size:13px;text-align:center;margin-top:12px;min-height:18px}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.pips{display:flex;gap:5px}
.pip{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.15)}
.pip.done{background:var(--yellow);border-color:var(--yellow)}
.pip.now{background:var(--red);border-color:#fff;box-shadow:0 0 8px var(--red)}
.roundlbl{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:8px}
.iconbtn{background:var(--slot);border:1px solid var(--line);color:var(--white);width:40px;height:40px;border-radius:12px;font-size:18px;cursor:pointer;display:grid;place-items:center}

.turnbanner{text-align:center;font-family:var(--display);font-weight:700;font-size:20px;
  padding:10px;border-radius:14px;margin-bottom:14px;
  background:linear-gradient(90deg,transparent,rgba(255,203,5,.14),transparent);
  transition:.2s}
.turnbanner .who{color:var(--yellow)}
.turnbanner.p2{background:linear-gradient(90deg,transparent,rgba(99,144,240,.16),transparent)}
.turnbanner.p2 .who{color:#8fb2ff}

/* ---------- rosters ---------- */
.rosters{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.roster{padding:8px 10px;border-radius:14px;border:1px solid var(--line);background:var(--slot);transition:.2s}
.roster.active{border-color:var(--yellow);background:linear-gradient(90deg,rgba(255,203,5,.10),transparent)}
.roster .rhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.rname{font-family:var(--display);font-weight:600;font-size:14px}
.rscore{font-family:var(--mono);font-size:13px;color:var(--yellow)}
.slots{display:flex;gap:6px}
.slot{flex:1;aspect-ratio:1;border-radius:10px;background:var(--slot);border:1px dashed rgba(255,255,255,.14);
  display:grid;place-items:center;position:relative;overflow:hidden}
.slot img{width:100%;height:100%;object-fit:contain;padding:2px}
.slot.filled{border-style:solid;border-color:var(--line);background:rgba(255,255,255,.04)}
.slot.shiny{box-shadow:inset 0 0 0 2px var(--yellow), 0 0 8px rgba(255,203,5,.4)}
.slot .num{position:absolute;top:2px;left:4px;font-family:var(--mono);font-size:9px;color:var(--muted)}
.slot.pop{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1)}}

/* ---------- arena / balls ---------- */
.arena{position:relative;padding:8px 4px 4px;margin-bottom:8px}
.arena .platform{
  position:absolute;left:50%;bottom:6px;transform:translateX(-50%);
  width:86%;height:44px;border-radius:50%;
  background:radial-gradient(ellipse at center, rgba(255,203,5,.18), transparent 70%);
  z-index:0;pointer-events:none
}
.arena-hint{text-align:center;color:var(--muted);font-size:13px;margin:2px 0 12px}
.balls{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:460px){.balls{grid-template-columns:repeat(2,1fr);gap:16px}}
.ballwrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.ball{
  --c:var(--red);
  width:100%;max-width:120px;aspect-ratio:1;border-radius:50%;position:relative;cursor:pointer;
  background:
    radial-gradient(circle at 34% 30%, rgba(255,255,255,.6), transparent 30%),
    linear-gradient(180deg, var(--c) 0 47%, #f4f4f8 53% 100%);
  border:4px solid #17162f;
  box-shadow:0 10px 18px rgba(0,0,0,.4), inset 0 -6px 12px rgba(0,0,0,.25);
  animation:wobble 3s ease-in-out infinite;
  transition:transform .1s ease;
}
.ball::before{content:"";position:absolute;left:-4px;right:-4px;top:calc(50% - 5px);height:10px;background:#17162f}
.ball::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:26%;aspect-ratio:1;border-radius:50%;background:#f4f4f8;border:4px solid #17162f;
  box-shadow:0 0 0 3px #f4f4f8, inset 0 0 6px rgba(0,0,0,.3)}
.ball:active{transform:scale(.94)}
.ball.shake{animation:shake .5s ease}
.ball.spent{opacity:.28;filter:grayscale(.7);cursor:default;animation:none}
.ball.opened{opacity:.2;filter:grayscale(.6);cursor:default;animation:none;transform:scale(.85)}
.balltag{font-family:var(--display);font-weight:600;font-size:12px;color:var(--muted)}
.ball.disabled{cursor:default;animation-play-state:paused}
@keyframes wobble{0%,88%,100%{transform:rotate(0)}92%{transform:rotate(-6deg)}96%{transform:rotate(6deg)}}
@keyframes shake{0%,100%{transform:rotate(0)}10%{transform:rotate(-14deg) scale(1.05)}30%{transform:rotate(14deg) scale(1.08)}
  50%{transform:rotate(-16deg) scale(1.1)}70%{transform:rotate(12deg) scale(1.06)}90%{transform:rotate(-6deg)}}

/* ball type variety (cosmetic) */
.ball.great{--c:#3a7bd5}
.ball.ultra{--c:#f2b134}
.ball.ultra::after{background:#111;box-shadow:0 0 0 3px #f4f4f8,inset 0 0 6px rgba(0,0,0,.4)}
.ball.master{--c:#7d3cc9}

/* ---------- reveal modal ---------- */
.backdrop{position:fixed;inset:0;background:rgba(8,6,26,.72);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;z-index:50;padding:18px}
.backdrop.show{display:flex;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.reveal{width:100%;max-width:360px;border-radius:26px;padding:20px 18px 18px;text-align:center;position:relative;
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.6);
  animation:burst .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes burst{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
.flash{position:fixed;inset:0;background:#fff;z-index:49;pointer-events:none;opacity:0}
.flash.go{animation:flash .5s ease}
@keyframes flash{0%{opacity:0}20%{opacity:.9}100%{opacity:0}}
.spritebox{position:relative;width:190px;height:190px;margin:0 auto 4px;display:grid;place-items:center}
.spritebox img{max-width:100%;max-height:100%;object-fit:contain;
  filter:drop-shadow(0 8px 14px rgba(0,0,0,.5));image-rendering:auto}
.spritebox.shiny::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at center, rgba(255,203,5,.28), transparent 62%);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.9);opacity:.6}50%{transform:scale(1.08);opacity:1}}
.spark{position:absolute;font-size:16px;pointer-events:none;animation:twinkle 1.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:1;transform:scale(1.1)}}
.badges{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:6px;min-height:10px}
.badge{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.5px;padding:3px 9px;border-radius:999px;text-transform:uppercase}
.badge.mega{background:linear-gradient(90deg,#7d3cc9,#c94fd8);color:#fff}
.badge.gmax{background:linear-gradient(90deg,#e0245e,#ff6a3d);color:#fff}
.badge.shiny{background:var(--yellow);color:#3a2a00}
.revname{font-family:var(--display);font-weight:700;font-size:24px;margin:2px 0 2px}
.types{display:flex;gap:6px;justify-content:center;margin:6px 0 10px}
.type{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:4px 10px;border-radius:999px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.statrow{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:14px}
.bst{font-family:var(--mono);font-size:15px;color:var(--muted)}
.bst b{color:#fff;font-size:26px}
.bonus{font-family:var(--mono);font-size:12px;color:var(--good)}
.reveal .actions{display:flex;gap:10px}
.reveal .actions .btn{font-size:16px;padding:14px}
.ai-note{color:var(--muted);font-size:13px;font-family:var(--mono);margin-top:4px;min-height:16px}

/* ---------- results ---------- */
.results{text-align:center;padding-top:10px}
.winner{font-family:var(--display);font-weight:700;font-size:34px;margin:6px 0 2px;
  background:linear-gradient(180deg,#fff,var(--yellow));-webkit-background-clip:text;background-clip:text;color:transparent}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start;margin:16px 0}
.vscol{padding:12px 8px;border-radius:18px}
.vscol.win{background:linear-gradient(180deg,rgba(255,203,5,.14),transparent);border:1px solid rgba(255,203,5,.35)}
.vscol h3{margin:0 0 2px;font-size:16px}
.vstotal{font-family:var(--mono);font-size:22px;color:var(--yellow);margin-bottom:8px}
.vsteam{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.vsmon{background:var(--slot);border:1px solid var(--line);border-radius:10px;padding:3px;position:relative;aspect-ratio:1}
.vsmon img{width:100%;height:100%;object-fit:contain}
.vsmon.shiny{box-shadow:inset 0 0 0 2px var(--yellow)}
.vsmid{font-family:var(--display);font-weight:700;font-size:22px;color:var(--muted);align-self:center}
.results .btn{margin-top:8px}
.confetti{position:fixed;top:-10px;font-size:16px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}

.spinner{width:34px;height:34px;border-radius:50%;border:4px solid rgba(255,255,255,.2);border-top-color:var(--yellow);animation:spin .8s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.foot{text-align:center;color:var(--muted);font-size:11px;margin-top:24px;opacity:.7}

/* ---------- battle mode ---------- */
.bwrap{display:flex;flex-direction:column;gap:12px}
.bhead{display:flex;align-items:center;justify-content:space-between}
.bhead h2{margin:0;font-size:22px;letter-spacing:1px}
.bhead .disp{color:var(--muted)}
.bpanel{position:relative;border-radius:18px;padding:12px 14px;border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));overflow:hidden}
.bpanel.you{background:linear-gradient(180deg,rgba(255,203,5,.10),rgba(255,255,255,.02));border-color:rgba(255,203,5,.3)}
.bpanel.foe{background:linear-gradient(180deg,rgba(238,43,58,.10),rgba(255,255,255,.02));border-color:rgba(238,43,58,.3)}
.brow{display:flex;align-items:center;gap:12px}
.bsprite{width:96px;height:96px;flex:0 0 96px;display:grid;place-items:center}
.bsprite img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5));transition:opacity .4s, transform .4s}
.bpanel.foe .bsprite img{transform:scaleX(-1)}
.bsprite.fainted img{opacity:.15;transform:translateY(14px) scale(.85)}
.bpanel.foe .bsprite.fainted img{transform:translateY(14px) scale(.85) scaleX(-1)}
.binfo{flex:1;min-width:0}
.bname{font-family:var(--display);font-weight:700;font-size:18px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.btypes{display:flex;gap:5px;margin:4px 0 7px}
.btypes .type{padding:2px 8px;font-size:10px}
.hpbar{height:12px;border-radius:8px;background:rgba(0,0,0,.35);overflow:hidden;border:1px solid rgba(255,255,255,.12)}
.hpfill{height:100%;width:100%;border-radius:8px;transition:width .5s ease, background .3s;background:var(--good)}
.hpfill.mid{background:var(--yellow)}
.hpfill.low{background:var(--red)}
.hptext{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px;display:flex;justify-content:space-between}
.bdots{display:flex;gap:4px;position:absolute;top:12px;right:14px}
.bdot{width:9px;height:9px;border-radius:50%;background:var(--good);border:1px solid rgba(255,255,255,.2)}
.bdot.out{background:rgba(255,255,255,.15)}
.bdot.active{box-shadow:0 0 0 2px var(--yellow)}
.bmid{text-align:center;font-family:var(--display);font-weight:700;color:var(--muted);font-size:13px;letter-spacing:2px;margin:-4px 0}
.blog{min-height:52px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.25);
  padding:9px 12px;font-size:13.5px;line-height:1.5;color:var(--white)}
.blog .eff{color:var(--yellow);font-weight:600}
.blog .crit{color:#ff8a5c;font-weight:600}
.blog .muted{color:var(--muted)}
.bmoves{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.moveb{border:none;cursor:pointer;border-radius:14px;padding:11px 12px;text-align:left;color:#fff;
  font-family:var(--display);font-weight:600;font-size:14px;line-height:1.2;
  box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .07s, box-shadow .07s;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.moveb:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.moveb:disabled{opacity:.5;cursor:not-allowed}
.moveb .mmeta{display:flex;justify-content:space-between;align-items:center;margin-top:5px;font-family:var(--mono);font-weight:400;font-size:10.5px;opacity:.9}
.moveb .mtag{text-transform:uppercase;letter-spacing:.5px}
.bctrl{display:flex;gap:9px}
.bctrl .btn{padding:12px}
.bfx{position:fixed;inset:0;pointer-events:none;z-index:40}
.hitflash{animation:hitflash .4s ease}
@keyframes hitflash{0%,100%{filter:none}30%{filter:brightness(2) saturate(0)}}
.shake-x{animation:shakex .35s ease}
@keyframes shakex{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* ---------- classic (OG) battle skin ---------- */
.battle-wrapper{display:flex;gap:12px;max-width:900px;margin:0 auto;justify-content:center}
.gb{flex:0 1 520px;display:flex;flex-direction:column;gap:10px}
.gb-recap{flex:1;min-width:200px;max-width:300px;display:flex;flex-direction:column;gap:10px}
.gb-field{position:relative;aspect-ratio:1/0.82;border-radius:10px;overflow:hidden;border:3px solid #14131f;
  background:linear-gradient(#bfe9ff 0 54%, #6cc05a 54% 56.5%, #cdeecb 56.5% 100%);
  box-shadow:inset 0 0 0 2px #f8f8f0}
.gb-field img{image-rendering:pixelated}
.plat{position:absolute;width:44%;height:10%;border-radius:50%;background:rgba(70,140,60,.30)}
.plat.foe{top:31%;right:3%}
.plat.you{bottom:10%;left:1%}
.bslot{position:absolute}
.foeHp{top:10px;left:10px;width:53%}
.youHp{bottom:10px;right:10px;width:53%}
.foeMon{top:8%;right:7%;width:33%;max-width:120px}
.youMon{bottom:12%;left:5%;width:41%;max-width:152px}
.foeMon .bsprite,.youMon .bsprite{width:100%;aspect-ratio:1;display:grid;place-items:center}
.foeMon img,.youMon img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 5px rgba(0,0,0,.4));transition:opacity .4s,transform .4s}
.bsprite.fainted img{opacity:.1;transform:translateY(16px) scale(.8)}
.gb-box{background:#f8f8f0;border:3px solid #14131f;border-radius:9px;box-shadow:0 3px 0 #14131f}
.hpbox{padding:7px 9px}
.hb-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.hb-name{font-family:var(--pixel);font-size:9px;color:#14131f;letter-spacing:.5px;line-height:1.2}
.hb-lv{font-family:var(--pixel);font-size:8px;color:#14131f}
.hb-bar{display:flex;align-items:center;gap:5px;margin-top:7px}
.hb-hp{font-family:var(--pixel);font-size:7px;color:#f8d030;background:#14131f;padding:2px 3px;border-radius:2px}
.hpbar{flex:1;height:9px;border-radius:6px;background:#585868;border:2px solid #14131f;overflow:hidden;padding:0}
.hpfill{height:100%;width:100%;border-radius:0;background:#68d048;transition:width .5s ease,background .3s}
.hpfill.mid{background:#f8d030}
.hpfill.low{background:#f85838}
.hb-num{font-family:var(--pixel);font-size:8px;color:#14131f;text-align:right;margin-top:5px}
.hb-dots{display:flex;gap:3px;justify-content:flex-end;margin-top:6px}
.bdot{width:8px;height:8px;border-radius:50%;background:#68d048;border:1.5px solid #14131f;box-shadow:none}
.bdot.out{background:#c8c8c8}
.gb-text{font-family:var(--pixel);font-size:10px;line-height:1.9;color:#14131f;background:#f8f8f0;
  border:3px solid #14131f;border-radius:9px;box-shadow:0 3px 0 #14131f;padding:12px 13px;min-height:56px}
.gb-text b{color:#14131f}
.gb-text .eff{color:#c02020}
.gb-text .crit{color:#d06010}
.gb-text .muted{color:#5b6472}
.gb-menu{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.recap-head{font-family:var(--pixel);font-size:11px;font-weight:600;color:#14131f;background:#f8f8f0;
  border:2px solid #14131f;border-radius:6px;padding:8px 10px;text-align:center;letter-spacing:.5px}
.recap-scroll{flex:1;background:#f8f8f0;border:3px solid #14131f;border-radius:9px;box-shadow:0 3px 0 #14131f;

  max-height:400px}
.recap-scroll b{color:#14131f}
.recap-scroll .eff{color:#c02020}
.recap-scroll .crit{color:#d06010}
.recap-scroll .muted{color:#5b6472}
.mvb{font-family:var(--pixel);font-size:9px;line-height:1.35;background:#f8f8f0;color:#14131f;
  border:3px solid #14131f;border-radius:8px;box-shadow:0 3px 0 #14131f;
  padding:11px 10px 11px 20px;text-align:left;position:relative;cursor:pointer}
.mvb::before{content:"▶";position:absolute;left:7px;top:11px;color:#e03030;opacity:0}
.mvb:hover::before,.mvb:focus::before{opacity:1}
.mvb:active{transform:translateY(2px);box-shadow:0 1px 0 #14131f}
.mvb:disabled{opacity:.55;cursor:not-allowed}
.mv-dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle;border:1px solid #14131f}
.mv-sub{display:block;font-size:7px;color:#707888;margin-top:6px;letter-spacing:.3px}
.bhead h2{font-family:var(--pixel);font-size:14px}

.revabil{font-size:12px;color:var(--muted);background:rgba(255,255,255,.05);border:1px solid var(--line);
  border-radius:10px;padding:7px 10px;margin:2px 4px 10px;line-height:1.35}
.revabil b{color:var(--white)}
/* ---------- online lobby ---------- */
.online{max-width:460px;margin:0 auto;padding-top:6px}
.on-card{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.on-title{font-family:var(--display);font-weight:700;font-size:18px;margin-bottom:4px}
.on-sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.on-or{text-align:center;color:var(--muted);font-family:var(--display);margin:6px 0 12px}
.on-code{width:100%;text-align:center;letter-spacing:8px;text-transform:uppercase;
  background:var(--slot);border:1.5px solid var(--line);border-radius:12px;color:#fff;
  padding:12px;font-size:26px;font-family:var(--mono);margin-bottom:10px}
.on-code:focus{outline:none;border-color:var(--yellow)}
.on-bigcode{text-align:center;font-family:var(--mono);font-weight:700;font-size:44px;letter-spacing:10px;
  color:var(--yellow);margin:6px 0 14px;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.on-players{display:flex;flex-direction:column;gap:8px;margin:6px 0}
.on-player{display:flex;align-items:center;gap:9px;background:var(--slot);border:1px solid var(--line);
  border-radius:12px;padding:11px 13px;font-family:var(--display);font-weight:600;color:var(--muted)}
.on-player.on{color:#fff;border-color:rgba(55,214,122,.4)}
.on-player .dot{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.2)}
.on-player .dot.on{background:var(--good);box-shadow:0 0 8px var(--good)}
.on-ready{text-align:center;font-family:var(--display);font-weight:700;color:var(--good);font-size:17px;margin:12px 0 6px}
.net-wait{grid-column:1/-1;text-align:center;font-family:var(--pixel);font-size:10px;color:#14131f;background:#f8f8f0;
  border:3px solid #14131f;border-radius:9px;box-shadow:0 3px 0 #14131f;padding:16px 12px;line-height:1.6}

/* ---------- accounts (login bar + modal) ---------- */
.acctbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--slot);border:1px solid var(--line);border-radius:14px;
  padding:8px 12px;margin-bottom:10px;font-size:13.5px}
.acctbar.off{color:var(--muted);justify-content:center}
.acctbar .who{font-family:var(--display);font-weight:600}
.acctbar .rec{font-family:var(--mono);font-size:12px;color:var(--yellow)}
.acctbar .acbtn{margin-left:auto;background:var(--slot);border:1px solid var(--line);color:var(--white);
  border-radius:10px;padding:7px 12px;font-family:var(--display);font-weight:600;font-size:13px;cursor:pointer}
.acctbar .acbtn.primary{background:linear-gradient(180deg,var(--red),var(--red-d));border:none;box-shadow:0 3px 0 #7c1420}
.modal-back{position:fixed;inset:0;background:rgba(8,6,26,.72);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;z-index:60;padding:18px}
.modal-back.show{display:flex;animation:fade .2s ease}
.acct{width:100%;max-width:340px;border-radius:22px;padding:18px 16px;
  background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
  box-shadow:0 24px 60px rgba(0,0,0,.6)}
.acct-tabs{display:flex;gap:8px;margin-bottom:14px}
.acct-tab{flex:1;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--slot);
  color:var(--muted);font-family:var(--display);font-weight:600;font-size:15px;cursor:pointer}
.acct-tab.on{border-color:var(--yellow);color:#fff;background:linear-gradient(180deg,rgba(255,203,5,.18),rgba(255,203,5,.05))}
.acct-in{width:100%;background:var(--slot);border:1.5px solid var(--line);border-radius:12px;
  color:#fff;padding:12px;font-size:15px;font-family:system-ui;margin-bottom:10px}
.acct-in:focus{outline:none;border-color:var(--yellow)}
.acct-err{color:#ff8a8a;font-size:13px;min-height:18px;margin-bottom:6px;text-align:center}
.acct-note{color:var(--muted);font-size:11.5px;line-height:1.4;margin-top:12px;text-align:center}

/* ---------- battle engine UI (abilities, status, weather) ---------- */
.hb-abil{font-family:var(--pixel);font-size:6.5px;color:#4a5a70;margin-top:5px;letter-spacing:.2px}
.hb-status{font-family:var(--pixel);font-size:6.5px;color:#fff;padding:1px 3px;border-radius:3px;display:none;vertical-align:middle}
.bweather{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:5;
  font-family:var(--pixel);font-size:8px;background:rgba(20,19,31,.82);color:#fff;
  padding:4px 8px;border-radius:6px;border:2px solid #14131f}
.abflash{position:absolute;z-index:7;font-family:var(--pixel);font-size:8px;color:#14131f;background:#f8d030;
  border:2px solid #14131f;border-radius:6px;padding:4px 7px;pointer-events:none;white-space:nowrap;
  box-shadow:0 3px 0 #14131f;animation:abpop 1.1s ease forwards}
.abflash.ab-foe{top:6%;right:6%;animation-name:abpopR}
.abflash.ab-you{bottom:20%;left:4%;animation-name:abpopL}
@keyframes abpopR{0%{opacity:0;transform:translateX(14px)}15%{opacity:1;transform:translateX(0)}80%{opacity:1}100%{opacity:0;transform:translateX(-6px)}}
@keyframes abpopL{0%{opacity:0;transform:translateX(-14px)}15%{opacity:1;transform:translateX(0)}80%{opacity:1}100%{opacity:0;transform:translateX(6px)}}
/* weather field tints + particles */
.wfx{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.wfx span{position:absolute;top:-10%;font-size:12px;color:rgba(255,255,255,.8);animation:wfall linear infinite;animation-duration:1.1s}
.gb-field.w-snow .wfx span{color:#fff;font-size:9px;animation-duration:2.2s}
@keyframes wfall{to{transform:translateY(115%)}}
.gb-field.w-rain{filter:brightness(.9) saturate(.9)}
.gb-field.w-rain::after,.gb-field.w-sun::after,.gb-field.w-sand::after,.gb-field.w-snow::after{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;mix-blend-mode:multiply}
.gb-field.w-rain::after{background:linear-gradient(180deg,rgba(40,70,120,.28),rgba(40,70,120,.12))}
.gb-field.w-sun::after{background:linear-gradient(180deg,rgba(255,180,60,.26),transparent);mix-blend-mode:screen}
.gb-field.w-sand::after{background:linear-gradient(180deg,rgba(200,170,90,.34),rgba(160,130,70,.22))}
.gb-field.w-snow::after{background:linear-gradient(180deg,rgba(200,225,245,.32),rgba(200,225,245,.14))}
.typeflash{position:absolute;inset:0;opacity:.0;animation:tflash .34s ease forwards;mix-blend-mode:screen}
@keyframes tflash{0%{opacity:0}30%{opacity:.55}100%{opacity:0}}

/* ---------- item bag ---------- */
.ibwrap{display:flex;flex-direction:column;gap:12px}
.ihint{color:var(--muted);font-size:13px;margin:0}
.igrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
@media(max-width:460px){.igrid{grid-template-columns:repeat(2,1fr)}}
.icard{background:var(--slot);border:1.5px solid var(--line);border-radius:14px;padding:8px 8px 6px;text-align:center;cursor:pointer;transition:.12s}
.icard.on{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(255,203,5,.15)}
.ispr{aspect-ratio:1.35;display:grid;place-items:center}
.ispr img{width:76px;height:76px;object-fit:contain}
.iname{font-family:var(--display);font-weight:600;font-size:12.5px;line-height:1.15;min-height:30px;display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap}
.iheld{font-size:11.5px;margin-top:5px;min-height:17px;color:var(--good);cursor:pointer}
.iheld .muted{color:var(--muted);cursor:default}
.ibadge{font-size:8px;font-weight:700;padding:1px 5px;border-radius:6px;color:#fff}

.ibadge.gmax{background:linear-gradient(90deg,#e0245e,#ff6a3d)}
.ibaglbl{font-family:var(--display);font-weight:600;font-size:13px;color:var(--muted)}
.ibagrow{display:flex;flex-wrap:wrap;gap:8px}
.ibag{flex:1 1 88px;display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--slot);border:1.5px solid var(--line);border-radius:12px;padding:9px 6px;color:var(--white);cursor:pointer}
.ibag .iemj{font-size:20px;line-height:1}
.ibag .inm{font-family:var(--display);font-size:11px;font-weight:600;text-align:center}
.ibag .ict{font-family:var(--mono);font-size:10px;color:var(--yellow)}
.ibag.gone{opacity:.32;cursor:not-allowed}
.ibag:not(.gone):active{transform:translateY(2px)}
.idesc{min-height:34px;font-size:12.5px;color:var(--muted);background:rgba(0,0,0,.22);border-radius:10px;padding:8px 11px;line-height:1.4}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important}
  .ball{animation:none}
}

/* ---------------- helpers ---------------- */
const $=id=>document.getElementById(id);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;

function parseName(name){
  const parts=name.split("-");
  let mega=parts.includes("mega"), gmax=parts.includes("gmax"), variant="";
  if(mega){const i=parts.indexOf("mega"); if(parts[i+1]) variant=parts[i+1].toUpperCase();}
  const drop=new Set(["mega","gmax"]); if(mega&&variant) drop.add(variant.toLowerCase());
  let words=parts.filter(p=>!drop.has(p));
  let display=words.map(cap).join(" ")||cap(name.replace(/-/g," "));
  return {display,mega,gmax,variant};
}
function score(m){return Math.round(m.bst*(m.shiny?1.15:1));}

// ---- images: build URLs from the numeric id (never trust nullable API fields) ----
function spriteUrls(id,shiny){
  const s=shiny?"/shiny":"";
  return [
    `${SPR}/other/official-artwork${s}/${id}.png`,
    `${SPR}/other/home${s}/${id}.png`,
    `${SPR}${s}/${id}.png`,
    `${SPR}/other/official-artwork/${id}.png`,
    `${SPR}/${id}.png`,
  ];
}
const PH="data:image/svg+xml;utf8,"+encodeURIComponent(
  "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>"+
  "<circle cx='50' cy='50' r='45' fill='#f4f4f8' stroke='#17162f' stroke-width='5'/>"+
  "<path d='M5 50a45 45 0 0 1 90 0z' fill='#ee2b3a'/>"+
  "<line x1='5' y1='50' x2='95' y2='50' stroke='#17162f' stroke-width='7'/>"+
  "<circle cx='50' cy='50' r='13' fill='#fff' stroke='#17162f' stroke-width='6'/></svg>");
function setSprite(img,urls){
  let i=0;
  img.onerror=()=>{ i++; if(i<urls.length){ img.src=urls[i]; } else { img.onerror=null; img.src=PH; } };
  img.src=urls[0]||PH;
}
function hydrateSprites(root){
  root.querySelectorAll("img[data-id]").forEach(img=>{
    if(img.dataset.hy) return; img.dataset.hy="1";
    setSprite(img, spriteUrls(+img.dataset.id, img.dataset.shiny==="1"));
  });
}

// ---- draw-style helpers ----
function shinyRateFor(style){ return style==="chaos"?0.5:0.08; }
function pickWeighted(pairs){
  const tot=pairs.reduce((a,p)=>a+p[1],0); let r=Math.random()*tot;
  for(const [v,w] of pairs){ if((r-=w)<0) return v; }
  return pairs[0][0];
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

// Map any form name (e.g. "charizard-mega-x") back to its base species.
function speciesOf(name){
  if(!S.speciesSet) return null;
  const parts=name.split("-");
  for(let i=parts.length;i>=1;i--){
    const cand=parts.slice(0,i).join("-");
    if(S.speciesSet.has(cand)) return cand;
  }
  return null;
}
// Tag every drawable entry with its region (generation) + legendary + mythical flags + bst.
function buildMeta(){
  S.meta={};
  if(S.apiOk && S.speciesSet){
    for(const n of S.pokedex){
      const sp=speciesOf(n);
      const id=sp?S.speciesId[sp]:0;
      S.meta[n]={gen:id?genFromId(id):0, legendary: sp?LEGENDARY.has(sp):false, mythical: sp?MYTHICAL.has(sp):false};
    }
  } else {
    for(const f of FALLBACK){
      S.meta[f[0]]={gen:genFromId(f[1]), legendary:LEGENDARY.has(f[0]), mythical:MYTHICAL.has(f[0]), bst:f[2]};
    }
  }
}
// Apply the region + legendary settings to produce the draw pool.
// Cosmetic / ride / gimmick forms that have no official artwork (or aren't real
// battle forms) — these show a blank Poké Ball and must never be draftable.
const JUNK_FORM=/-(totem|cosplay|rock-star|belle|pop-star|phd|libre|starter|eternamax|battle-bond|ash|own-tempo|gulping|gorging|hangry|noice|power-construct|glide-mode|drive-mode|aquatic-mode|low-power-mode|apex-build|limited-build|sprinting-build|swimming-build|gliding-build|cap)$/;
function isJunkForm(n){ return JUNK_FORM.test(n); }
function computePool(){
  S.pool=S.pokedex.filter(n=>{
    if(isJunkForm(n)) return false;
    const m=S.meta[n];
    if(!m) return S.region===0;
    if(S.region!==0 && m.gen!==S.region) return false;
    if(S.noLegendaries && m.legendary) return false;
    if(S.legendaryOnly && !m.legendary) return false;
    if(S.mythicalOnly && !m.mythical) return false;
    if(S.statMax!==null && m.bst && m.bst>S.statMax) return false;
    if(S.statMin!==null && m.bst && m.bst<S.statMin) return false;
    return true;
  });
  if(!S.pool.length) S.pool=S.pokedex.slice();
  return S.pool;
}

/* ---------------- data layer ---------------- */
async function loadData(){
  // 1) every Pokémon incl. megas / gmax / regional forms
  try{
    const r=await fetch(`${API}/pokemon?limit=100000&offset=0`);
    if(!r.ok) throw 0;
    const d=await r.json();
    S.pokedex=d.results.map(x=>x.name);
    S.apiOk=S.pokedex.length>50;
  }catch(e){ S.apiOk=false; }
  // 2) species list -> national-dex id per species (for region tagging)
  if(S.apiOk){
    try{
      const r=await fetch(`${API}/pokemon-species?limit=100000`);
      if(!r.ok) throw 0;
      const d=await r.json();
      S.speciesSet=new Set(); S.speciesId={};
      for(const s of d.results){
        const mm=s.url.match(/\/(\d+)\/?$/); const id=mm?+mm[1]:0;
        S.speciesSet.add(s.name); S.speciesId[s.name]=id;
      }
    }catch(e){ S.speciesSet=null; }
  }
  if(!S.apiOk){ S.pokedex=FALLBACK.map(f=>f[0]); }
  buildMeta();
  return S.apiOk;
}

async function fetchMon(name){
  if(S.cache[name]) return S.cache[name];
  const r=await fetch(`${API}/pokemon/${name}`);
  if(!r.ok) throw new Error("no mon");
  const d=await r.json();
  const bst=d.stats.reduce((a,s)=>a+s.base_stat,0);
  const types=d.types.map(t=>t.type.name);
  const st={}; d.stats.forEach(s=>st[s.stat.name]=s.base_stat);
  let stats={hp:st.hp,atk:st.attack,def:st.defense,spa:st["special-attack"],spd:st["special-defense"],spe:st.speed};
  const base=(typeof speciesOf==="function" && speciesOf(name))||name.split("-")[0];
  const pn=parseName(name);
  // Hydro Bliss stat rebalance — apply to base species (not Mega/G-Max, which keep their boosted forms)
  let bst2=bst;
  if(!pn.mega && !pn.gmax){
    const hs=HB_STATS[hbNorm(name)]||HB_STATS[hbNorm(base)];
    if(hs){ stats={hp:hs[0],atk:hs[1],def:hs[2],spa:hs[3],spd:hs[4],spe:hs[5]}; bst2=hs[0]+hs[1]+hs[2]+hs[3]+hs[4]+hs[5]; }
  }
  const ability=hbAbilityFor(base,d.id);
  const mon={name,id:d.id,bst:bst2,types,stats,ability,...pn};
  S.cache[name]=mon; return mon;
}

async function rollMon(){
  const shiny=Math.random()<S.shinyRate;
  const pool=(S.pool&&S.pool.length)?S.pool:S.pokedex;
  if(S.apiOk){
    for(let t=0;t<6;t++){
      try{
        const m=await fetchMon(rnd(pool));
        const imgList=spriteUrls(m.id,shiny);
        return {...m,shiny,imgList,img:imgList[0]};
      }catch(e){/* retry */}
    }
  }
  const f=FALLBACK_MAP[rnd(pool)]||rnd(FALLBACK);
  const imgList=spriteUrls(f[1],shiny);
  return {name:f[0],id:f[1],bst:f[2],types:f[3],shiny,imgList,img:imgList[0],
          ...parseName(f[0])};
}

// Build the 4 balls for a turn according to the chosen draw style.
async function generateTurnMons(){
  if(S.drawStyle==="fair"){
    const K=8;
    const c=await Promise.all(Array.from({length:K},()=>rollMon()));
    c.sort((a,b)=>a.bst-b.bst);
    const nStrong=pickWeighted([[2,58],[1,16],[3,16],[0,5],[4,5]]);
    const strong=c.slice(c.length-nStrong);   // strongest of the batch
    const weak=c.slice(0,4-nStrong);           // weakest of the batch
    return shuffle([...strong,...weak]);
  }
  // classic / chaos: pure luck, each ball independent
  return Promise.all([rollMon(),rollMon(),rollMon(),rollMon()]);
}

function updatePreview(){
  const ll=$("loadline"); if(!ll) return;
  if(!Object.keys(S.meta).length){ ll.textContent="Loading the National Pokédex…"; return; }
  computePool();
  const scope = S.region===0 ? (S.apiOk?"National Dex":"starter roster") : REGION_NAMES[S.region-1];
  const legs  = S.noLegendaries ? " · no legendaries" : "";

  const src   = S.apiOk ? "" : " (offline roster)";
  ll.textContent = `${S.pool.length} in pool · ${scope}${legs} · ${style}${src} ✓`;
}
function bindChips(wrapId,cb){

    w.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));

/* ---------- TURN ---------- */
async function beginTurn(){
  S.busy=true; S.activeIdx=null;
  S.players[S.cur].noGoRoundLeft=S.noGoPerRound;   // refreshes every round
  updateTopbar(); updateBanner(); updateRosters();
  const hint=$("arenahint"), ballsEl=$("balls");
  hint.textContent="Summoning Pokémon…";
  ballsEl.innerHTML=`<div style="grid-column:1/-1"><div class="spinner"></div></div>`;
  const mons=await generateTurnMons();
  S.balls=mons.map((m,i)=>({mon:m,state:"closed",style:BALL_STYLES[i]}));
  paintBalls();
  const p=S.players[S.cur];
  hint.textContent=p.ai?"Watch your rival draft…":"Tap a ball to reveal what's inside.";
  S.busy=false;
  if(p.ai){ aiTurn(); }
}
function paintBalls(){
  const el=$("balls"); el.innerHTML="";
  S.balls.forEach((b,i)=>{
    const w=document.createElement("div"); w.className="ballwrap";
    const ball=document.createElement("div");
    ball.className="ball "+b.style+(b.state==="spent"?" spent":b.state==="open"?" opened":"");
    ball.dataset.i=i;
    if(b.state==="closed") ball.onclick=()=>onBallTap(i);
    const tag=document.createElement("div"); tag.className="balltag";
    tag.textContent=b.state==="spent"?"passed":b.state==="open"?"opened":BALL_NAMES[i];
    w.appendChild(ball); w.appendChild(tag); el.appendChild(w);
  });
}

function onBallTap(i){
  if(S.busy) return;
  const p=S.players[S.cur]; if(p.ai) return;
  openBall(i);
}

async function openBall(i){
  if(S.balls[i].state!=="closed") return;
  S.busy=true;
  const el=$("balls").querySelector(`.ball[data-i="${i}"]`);
  if(el){ el.classList.add("shake"); el.onclick=null; }
  beep(300,.05,"sawtooth",.04);
  await wait(430);
  // flash
  const fl=$("flash"); fl.classList.remove("go"); void fl.offsetWidth; fl.classList.add("go");
  S.balls[i].state="open"; S.activeIdx=i;
  paintBalls();
  const m=S.balls[i].mon;
  if(m.shiny) sfxShiny(); else sfxPick();
  showReveal();
  S.busy=false;
}

/* ---------- REVEAL ---------- */
function showReveal(){
  const m=S.balls[S.activeIdx].mon;
  const p=S.players[S.cur];
  const closedLeft=S.balls.filter(b=>b.state==="closed").length;
  const canNoGo=p.noGoRoundLeft>0 && closedLeft>0;

  let badges="";
  if(m.mega) badges+=`<span class="badge mega">Mega${m.variant?" "+m.variant:""}</span>`;
  if(m.gmax) badges+=`<span class="badge gmax">Gigantamax</span>`;
  if(m.shiny)badges+=`<span class="badge shiny">✦ Shiny</span>`;

  const typeChips=m.types.map(t=>
    `<span class="type" style="background:${TYPE_COLORS[t]||"#777"}">${t}</span>`).join("");

  const sparks = m.shiny ? `
     <span class="spark" style="top:6%;left:12%">✦</span>
     <span class="spark" style="top:20%;right:8%;animation-delay:.4s">✧</span>
     <span class="spark" style="bottom:14%;left:6%;animation-delay:.8s">✦</span>` : "";

  const bonus = m.shiny ? `<span class="bonus">+15%</span>` : "";

  let noteHtml="";
  if(!canNoGo){
    if(S.noGoPerRound===0) noteHtml=`<div class="ai-note">No Go is switched off.</div>`;
    else if(p.noGoRoundLeft<=0) noteHtml=`<div class="ai-note">No Go already used this round.</div>`;
    else if(closedLeft<=0) noteHtml=`<div class="ai-note">No other balls left — you'll keep this one.</div>`;
  }

  const actions = p.ai ? `<div class="ai-note" id="aiNote"></div>` : `
    <div class="actions">
      <button class="btn" id="keep">Keep</button>
      <button class="btn ghost" id="nogo" ${canNoGo?"":"disabled"}>No&nbsp;Go</button>
    </div>
    ${noteHtml}`;

  $("revealHost").innerHTML=`
    <div class="reveal">
      <div class="badges">${badges}</div>
      <div class="spritebox ${m.shiny?"shiny":""}">
        ${sparks}
        <img alt="${escapeHtml(m.display)}" id="revImg">
      </div>
      <div class="revname">${escapeHtml(m.display)}</div>
      <div class="types">${typeChips}</div>
      ${m.ability&&HB_AB[m.ability]?`<div class="revabil"><b>${escapeHtml(HB_AB[m.ability].n)}</b> — ${escapeHtml(HB_AB[m.ability].d)}</div>`:``}
      <div class="statrow">
        <span class="bst">BST <b>${m.bst}</b></span>
        ${bonus}
        <span class="bst" style="color:var(--yellow)">→ ⚡${score(m)}</span>
      </div>
      ${actions}
    </div>`;
  const img=$("revImg"); if(img) setSprite(img, m.imgList||spriteUrls(m.id,m.shiny));
  $("backdrop").classList.add("show");

  if(!p.ai){
    $("keep").onclick=keepMon;
    const ng=$("nogo"); if(ng && canNoGo) ng.onclick=useNoGo;
  }
}
function hideReveal(){ $("backdrop").classList.remove("show"); }

function keepMon(){
  const p=S.players[S.cur];
  const m=S.balls[S.activeIdx].mon;
  p.team.push(m);
  beep(880,.1,"triangle",.05);
  hideReveal();
  // pop the newly filled slot after roster repaint
  updateRosters();
  const rr=$("rosters");
  const slot=rr.querySelector(`.slot[data-pi="${S.cur}"][data-si="${p.team.length-1}"]`);
  if(slot) slot.classList.add("pop");
  endTurn();
}

async function useNoGo(){
  const p=S.players[S.cur];
  if(p.noGoRoundLeft<=0) return;
  p.noGoRoundLeft--;
  S.balls[S.activeIdx].state="spent";
  S.activeIdx=null;
  beep(200,.12,"sawtooth",.05);
  hideReveal();
  paintBalls(); updateRosters();
  $("arenahint").textContent="Reroll! Pick another ball — you must keep the next one.";
}

/* ---------- AI ---------- */
async function aiTurn(){
  const p=S.players[S.cur];
  await wait(650);
  while(true){
    const closed=S.balls.map((b,i)=>b.state==="closed"?i:-1).filter(i=>i>=0);
    const i=rnd(closed);
    await openBall(i);
    await wait(950);
    const m=S.balls[i].mon;
    const othersLeft=closed.length-1;
    const wantKeep = m.shiny||m.mega||m.gmax||m.bst>=480||p.noGoRoundLeft<=0||othersLeft<=0;
    const note=$("aiNote");
    if(wantKeep){
      if(note) note.textContent=(m.shiny||m.mega||m.gmax)?"“I'll take that — rare one!”":(m.bst>=480?"“Strong enough. Keeping it.”":"“I'll keep this.”");
      await wait(700);
      keepMon();
      return;
    } else {
      if(note) note.textContent="“Not good enough — No Go!”";
      await wait(750);
      useNoGo();
      await wait(500);
    }
  }
}

/* ---------- end turn / round ---------- */
function endTurn(){
  if(S.online){   // online: only the local trainer drafts their own 6
    if(S.round>=6){ setTimeout(startItemPhase,500); return; }
    S.round++; S.cur=0; setTimeout(beginTurn,450); return;
  }
  if(S.cur===0){ S.cur=1; setTimeout(beginTurn,450); return; }
  // player 2 just finished -> next round
  S.cur=0;
  if(S.round>=6){ setTimeout(S.battleMode?startItemPhase:showResults,500); return; }
  S.round++;
  setTimeout(beginTurn,450);
}

/* ---------- RESULTS ---------- */
function showResults(){ S.screen="results"; render(); }
function renderResults(){
  const [a,b]=S.players;
  const sa=a.team.reduce((x,m)=>x+score(m),0);
  const sb=b.team.reduce((x,m)=>x+score(m),0);
  const draw=sa===sb;
  const winA=sa>sb;
  const wname=draw?"It's a draw!":(winA?a.name:b.name);
  sfxWin(); confetti();

  const teamHtml=(pl)=>pl.team.map(m=>
    `<div class="vsmon ${m.shiny?"shiny":""}" title="${escapeHtml(m.display)} · ⚡${score(m)}">
       <img data-id="${m.id}" data-shiny="${m.shiny?1:0}" alt="${escapeHtml(m.display)}"></div>`).join("");

  $("app").innerHTML=`
    <div class="results">
      <div style="font-family:var(--display);color:var(--muted);letter-spacing:2px;font-size:13px">— FINAL —</div>
      <div class="winner">${draw?"Draw!":"🏆 "+escapeHtml(wname)}</div>
      <div style="color:var(--muted);font-size:13px">${draw?"Perfectly matched teams.":"wins the duel"}</div>

      <div class="vs">
        <div class="vscol ${(!draw&&winA)?"win":""}">
          <h3>${escapeHtml(a.name)}</h3>
          <div class="vstotal">⚡ ${sa}</div>
          <div class="vsteam">${teamHtml(a)}</div>
        </div>
        <div class="vsmid">VS</div>
        <div class="vscol ${(!draw&&!winA)?"win":""}">
          <h3>${escapeHtml(b.name)}${b.ai?" 🤖":""}</h3>
          <div class="vstotal">⚡ ${sb}</div>
          <div class="vsteam">${teamHtml(b)}</div>
        </div>
      </div>

      <button class="btn" id="again">Rematch</button>
      <button class="btn ghost" id="tobattle" style="margin-top:10px">⚔️ Battle these teams</button>
      <button class="btn ghost" id="menu" style="margin-top:10px">Change Settings</button>
    </div>
    <div class="foot">Tip: a well-timed “No Go” can swing the whole game.</div>
  `;
  hydrateSprites($("app"));
  $("tobattle").onclick=startItemPhase;
  $("again").onclick=()=>{ // same settings, fresh draft
    S.players=[
      {name:S.p1name, ai:false,  team:[], noGoRoundLeft:0},
      {name:S.p2name, ai:S.p2ai, team:[], noGoRoundLeft:0},
    ];
    S.round=1; S.cur=0; S.screen="game"; render(); beginTurn();
  };
  $("menu").onclick=()=>{ S.screen="setup"; render(); };
}
function confetti(){
  const em=["✦","✧","⚡","★","●"];
  for(let i=0;i<28;i++){
    const c=document.createElement("div");
    c.className="confetti"; c.textContent=rnd(em);
    c.style.left=Math.random()*100+"vw";
    c.style.color=rnd(["#ffcb05","#ee2b3a","#6390f0","#67ba43","#e28bc2"]);
    c.style.animationDuration=(2.4+Math.random()*1.8)+"s";
    c.style.animationDelay=(Math.random()*0.6)+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),4600);
  }
}

const DMG_SCALE=0.6, LV=50, IV=31;

// Real Lv.50 stat formulas (31 IVs, 0 EVs, neutral nature) — the same numbers
// a standard Pokémon damage calculator shows at level 50.
const l50hp=b=>Math.floor((2*b+IV)*LV/100)+LV+10;
const l50st=b=>Math.floor((2*b+IV)*LV/100)+5;
function statSpread(mon){
  if(mon.stats && mon.stats.hp) return mon.stats;
  const e=Math.round((mon.bst||360)/6); return {hp:e,atk:e,def:e,spa:e,spd:e,spe:e};
}
function battleStats(mon){
  const s=statSpread(mon);
  return {maxHp:l50hp(s.hp),atk:l50st(s.atk),def:l50st(s.def),spa:l50st(s.spa),spd:l50st(s.spd),spe:l50st(s.spe)};
}
function scaleStats(s,f){const o={};for(const k in s)o[k]=Math.max(1,Math.round(s[k]*f));return o;}
// deterministic per-species PRNG, so a species always draws the same varied moveset
function seeded(id){let s=((id||1)*2654435761)%2147483647; if(s<=0)s+=2147483646;
  return ()=>((s=s*16807%2147483647)-1)/2147483646;}
function assignMoves(mon){
  const hb=hbMovesFor(mon); if(hb&&hb.length) return hb;   // real Hydro Bliss learnset
  const s=statSpread(mon), physBias=(s.atk>=s.spa);
  const rng=seeded(mon.id||101), chosen=[], used=new Set();
  const push=m=>{ if(m&&!used.has(m.n)){chosen.push({name:m.n,type:m.type,power:m.p,cls:m.c,pri:m.pri||0}); used.add(m.n);} };
  const pref=pool=>{ const a=pool.filter(m=>m.c===(physBias?"physical":"special")); return a.length?a:pool; };
  const pick=(pool,type)=>{ const a=pref(pool); const m=a[Math.floor(rng()*a.length)]; return {...m,type}; };
  const sp=(mon.name||"").split("-")[0];
  if(SIGNATURE[sp]) push(SIGNATURE[sp]);
  for(const t of mon.types){ if(MOVES[t]) push(pick(MOVES[t],t)); }
  const others=Object.keys(MOVES).filter(t=>!mon.types.includes(t));
  for(let i=others.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[others[i],others[j]]=[others[j],others[i]];}
  for(const t of others){ if(chosen.length>=4)break; push(pick(MOVES[t],t)); }
  if(!chosen.length) push({n:"Struggle",p:50,c:"physical",type:"normal"});
  return chosen.slice(0,4);
}

function weatherActive(){ const w=S.bt&&S.bt.weather; if(!w||!w.kind) return null;
  if(S.bt){ for(const s of [0,1]){ const b=activeB(s); if(has(b,"CLOUDNINE")||has(b,"AIRLOCK")) return null; } } return w.kind; }
function eStat(bl,key){
  let v=bl.b[key]*STAGE(bl.stages[key]||0);
  if(key==="atk"){
    if(has(bl,"HUGEPOWER")||has(bl,"PUREPOWER")) v*=2;
    if(bl.status && has(bl,"GUTS")) v*=1.5;
    else if(bl.status==="brn") v*=0.5;
  }
  if(key==="spe"){
    if(bl.status==="par"&&!has(bl,"QUICKFEET")) v*=0.5;
    if(bl.status&&has(bl,"QUICKFEET")) v*=1.5;
    const w=weatherActive();
    if((w==="rain"&&has(bl,"SWIFTSWIM"))||(w==="sun"&&has(bl,"CHLOROPHYLL"))||(w==="sand"&&has(bl,"SANDRUSH"))||(w==="snow"&&has(bl,"SLUSHRUSH"))) v*=2;
  }
  return v;
}
function weatherMult(t){ const w=weatherActive();
  if(w==="rain"){ if(t==="water")return 1.5; if(t==="fire")return .5; }
  if(w==="sun"){ if(t==="fire")return 1.5; if(t==="water")return .5; }
  return 1; }
// defender absorbs/immunity abilities -> null or {immune,heal,boost:[stat,n],flashfire}
function absorbCheck(def,t){
  const a=def.ability;
  if(t==="ground"&&a==="LEVITATE") return {immune:true};
  if(t==="ground"&&a==="EARTHEATER") return {immune:true,heal:.25};
  if(t==="electric"){ if(a==="VOLTABSORB")return{immune:true,heal:.25}; if(a==="LIGHTNINGROD")return{immune:true,boost:["spa",1]}; if(a==="MOTORDRIVE")return{immune:true,boost:["spe",1]}; }
  if(t==="water"){ if(a==="WATERABSORB"||a==="DRYSKIN")return{immune:true,heal:.25}; if(a==="STORMDRAIN")return{immune:true,boost:["spa",1]}; }
  if(t==="fire"&&a==="FLASHFIRE") return {immune:true,flashfire:true};
  if(t==="grass"&&a==="SAPSIPPER") return {immune:true,boost:["atk",1]};
  return null;
}
function calcDamage(atk,def,mv){
  const phys=mv.cls==="physical";
  let A=phys?eStat(atk,"atk"):eStat(atk,"spa");
  let D=phys?eStat(def,"def"):eStat(def,"spd");
  if(phys&&has(def,"FURCOAT")) D*=2;
  if(!phys&&has(def,"ICESCALES")) D*=2;
  if(phys&&has(def,"MARVELSCALE")&&def.status) D*=1.5;
  const w=weatherActive();
  if(w==="sand"&&def.mon.types.includes("rock")&&!phys) D*=1.5;   // sand SpDef boost for Rock
  let base=Math.floor(Math.floor(Math.floor((2*LV/5+2)*mv.power*A/D)/50)+2);
  const stab=atk.mon.types.includes(mv.type)?(has(atk,"ADAPTABILITY")?2:1.5):1;
  const eff=typeEff(mv.type,def.mon.types);
  if(has(def,"WONDERGUARD")&&mv.power>0&&eff<2) return {d:0,eff,crit:false,wonder:true};
  let cc=0.0625; if(mv.highcrit) cc=0.125; if(has(atk,"SUPERLUCK")) cc*=2;
  let crit=Math.random()<cc?1.5:1;
  if(crit>1&&(has(def,"BATTLEARMOR")||has(def,"SHELLARMOR"))) crit=1;
  if(crit>1&&has(atk,"SNIPER")) crit=2.25;
  let am=1;
  if(mv.power<=60&&has(atk,"TECHNICIAN")) am*=1.5;
  if(isContact(mv)&&has(atk,"TOUGHCLAWS")) am*=1.3;
  if(mv.punch&&has(atk,"IRONFIST")) am*=1.2;
  if(mv.bite&&has(atk,"STRONGJAW")) am*=1.5;
  if(mv.pulse&&has(atk,"MEGALAUNCHER")) am*=1.5;
  if(hasSecondary(mv)&&has(atk,"SHEERFORCE")) am*=1.3;
  if(mv.type==="electric"&&has(atk,"TRANSISTOR")) am*=1.3;
  if(mv.type==="dragon"&&has(atk,"DRAGONSMAW")) am*=1.3;
  if(mv.type==="steel"&&has(atk,"STEELWORKER")) am*=1.5;
  if(mv.type==="rock"&&has(atk,"ROCKYPAYLOAD")) am*=1.5;
  if(mv.type==="water"&&has(atk,"WATERBUBBLE")) am*=2;
  if(mv.type==="fire"&&atk.flashfire) am*=1.5;
  if(mv.type==="dark"&&has(atk,"DARKAURA")) am*=1.33;
  if(mv.type==="fairy"&&has(atk,"FAIRYAURA")) am*=1.33;
  if(atk.hp<=atk.max/3){ if(mv.type==="fire"&&has(atk,"BLAZE"))am*=1.5; if(mv.type==="water"&&has(atk,"TORRENT"))am*=1.5; if(mv.type==="grass"&&has(atk,"OVERGROW"))am*=1.5; if(mv.type==="bug"&&has(atk,"SWARM"))am*=1.5; }
  if(w==="sand"&&(mv.type==="rock"||mv.type==="ground"||mv.type==="steel")&&has(atk,"SANDFORCE")) am*=1.3;
  am*=weatherMult(mv.type);
  let dm=1;
  if(has(def,"THICKFAT")&&(mv.type==="fire"||mv.type==="ice")) dm*=0.5;
  if(has(def,"HEATPROOF")&&mv.type==="fire") dm*=0.5;
  if(has(def,"WATERBUBBLE")&&mv.type==="fire") dm*=0.5;
  if((has(def,"MULTISCALE")||has(def,"SHADOWSHIELD"))&&def.hp>=def.max) dm*=0.5;
  if((has(def,"FILTER")||has(def,"SOLIDROCK")||has(def,"PRISMARMOR"))&&eff>=2) dm*=0.75;
  if(has(def,"FLUFFY")){ if(isContact(mv))dm*=0.5; if(mv.type==="fire")dm*=2; }
  const rnd=0.85+Math.random()*0.15;
  let d=Math.floor(base*stab*eff*crit*am*dm*rnd*DMG_SCALE);
  if(eff>0) d=Math.max(1,d);
  return {d,eff,crit:crit>1};
}
function bestMove(a,d){ let best=a.moves[0],bd=-1;
  for(const mv of a.moves){ const A=mv.cls==="physical"?a.b.atk:a.b.spa, D=mv.cls==="physical"?d.b.def:d.b.spd;
    const base=Math.floor(Math.floor((2*LV/5+2)*mv.power*A/D)/50)+2;
    const acc=(mv.acc==null||mv.acc<=0)?100:mv.acc;
    const est=base*(a.mon.types.includes(mv.type)?1.5:1)*typeEff(mv.type,d.mon.types)*(acc/100);
    if(est>bd){bd=est;best=mv;} }
  return best;
}

function makeBattler(mon){
  const item=mon.item||null;
  const isMega=!!(mon.mega&&item==="mega");
  const isGmax=!!(mon.gmax&&item==="gmax");
  // A drafted Mega / G-Max that is NOT holding its stone reverts to its base form.
  let src=mon;
  if((mon.mega||mon.gmax)&&!isMega&&!isGmax){
    src={id:mon.id,name:mon.name,types:mon.types,bst:mon.bst,
         stats:mon.baseStats||scaleStats(statSpread(mon),0.85)};
  }
  let b=battleStats(src);
  if(item==="bulb") b={...b,atk:Math.round(b.atk*1.2),spa:Math.round(b.spa*1.2),maxHp:Math.max(1,Math.round(b.maxHp*0.9))};
  if(isGmax)        b={...b,maxHp:Math.round(b.maxHp*1.5)};
  const moves=assignMoves(mon).map(mv=>({...mv,...(MOVEFX[mv.name]||{})}));
  return {mon,b,item,isMega,isGmax,sashUsed:false,sitrusUsed:false,
          ability:mon.ability||null,
          stages:{atk:0,def:0,spa:0,spd:0,spe:0},
          status:null,toxicN:0,sleepT:0,flashfire:false,entered:false,flinched:false,
          moves,hp:b.maxHp,max:b.maxHp,fainted:false};
}
/* ---- stat-stage changes, status infliction, ability entry/KO hooks ---- */
function boost(bl,stat,n,announce=true){
  if(has(bl,"CONTRARY")) n=-n;
  if(has(bl,"SIMPLE")) n*=2;
  const before=bl.stages[stat]||0;
  bl.stages[stat]=Math.max(-6,Math.min(6,before+n));
  const d=bl.stages[stat]-before;
  if(announce&&d!==0){
    const nm={atk:"Attack",def:"Defense",spa:"Sp. Atk",spd:"Sp. Def",spe:"Speed"}[stat]||stat;
    const word=d>=2?"sharply rose":d>0?"rose":d<=-2?"harshly fell":"fell";
    pushLog(`<span class="muted">${escapeHtml(bl.mon.display)}'s ${nm} ${word}!</span>`);
  }
  return d;
}
function lower(target,stat,n,byFoe=true){
  if(byFoe&&(has(target,"CLEARBODY")||has(target,"WHITESMOKE")||has(target,"FULLMETALBODY"))){
    pushLog(`<span class="muted">${escapeHtml(target.mon.display)}'s ${abName(target)} prevents stat loss!</span>`); return; }
  boost(target,stat,-Math.abs(n));
  if(byFoe&&(has(target,"DEFIANT"))) boost(target,"atk",2);
  if(byFoe&&(has(target,"COMPETITIVE"))) boost(target,"spa",2);
}
function canStatus(bl,st){
  if(bl.status||bl.fainted) return false;
  if(has(bl,"COMATOSE")) return false;
  const T=bl.mon.types;
  if(st==="brn"&&(T.includes("fire")||has(bl,"WATERVEIL")||has(bl,"WATERBUBBLE")||has(bl,"THERMALEXCHANGE"))) return false;
  if(st==="par"&&(T.includes("electric")||has(bl,"LIMBER"))) return false;
  if((st==="psn"||st==="tox")&&((T.includes("poison")||T.includes("steel"))&&!has(bl,"CORROSION")||has(bl,"IMMUNITY")||has(bl,"PASTELVEIL"))) return false;
  if(st==="frz"&&(T.includes("ice")||has(bl,"MAGMAARMOR"))) return false;
  if(st==="slp"&&(has(bl,"INSOMNIA")||has(bl,"VITALSPIRIT")||has(bl,"SWEETVEIL"))) return false;
  return true;
}
function inflict(bl,st){
  if(!canStatus(bl,st)) return false;
  bl.status=st; if(st==="tox") bl.toxicN=1; if(st==="slp") bl.sleepT=1+Math.floor(Math.random()*3);
  pushLog(`<span class="eff">${escapeHtml(bl.mon.display)} was ${STATUS_NAME[st]}!</span>`);
  beep(220,.1,"sawtooth",.04);
  const side=sideOf(bl); if(side>=0) setStatusUI(side);
  return true;
}
function sideOf(bl){ if(!S.bt) return -1; for(const s of [0,1]) if(activeB(s)===bl) return s; return -1; }
function onEntry(side){
  const bl=activeB(side); if(!bl||bl.entered||bl.fainted) return;
  bl.entered=true; const foe=activeB(1-side); const nm=abName(bl); if(!nm) return;
  const ENTRY=new Set(["INTIMIDATE","DRIZZLE","DROUGHT","SANDSTREAM","SANDSPIT","SNOWWARNING","ICEAGE","INTREPIDSWORD","DAUNTLESSSHIELD","DOWNLOAD"]);
  if(ENTRY.has(bl.ability)) abilityBanner(side,nm);
  const setW=(k,label)=>{ S.bt.weather={kind:k,turns:5}; pushLog(`<span class="eff">${escapeHtml(bl.mon.display)}'s ${nm}: ${label}</span>`); paintWeather(); };
  if(bl.ability==="INTIMIDATE"&&foe&&!foe.fainted){ pushLog(`<span class="eff">${escapeHtml(bl.mon.display)}'s Intimidate!</span>`); lower(foe,"atk",1); }
  else if(bl.ability==="DRIZZLE") setW("rain","it started to rain!");
  else if(bl.ability==="DROUGHT") setW("sun","the sunlight turned harsh!");
  else if(bl.ability==="SANDSTREAM"||bl.ability==="SANDSPIT") setW("sand","a sandstorm kicked up!");
  else if(bl.ability==="SNOWWARNING"||bl.ability==="ICEAGE") setW("snow","it started to snow!");
  else if(bl.ability==="INTREPIDSWORD"){ pushLog(`<span class="eff">${escapeHtml(bl.mon.display)}'s Intrepid Sword!</span>`); boost(bl,"atk",1); }
  else if(bl.ability==="DAUNTLESSSHIELD"){ pushLog(`<span class="eff">${escapeHtml(bl.mon.display)}'s Dauntless Shield!</span>`); boost(bl,"def",1); }
  else if(bl.ability==="DOWNLOAD"&&foe&&!foe.fainted){ pushLog(`<span class="eff">${escapeHtml(bl.mon.display)}'s Download!</span>`); boost(bl, (eStat(foe,"def")<=eStat(foe,"spd")?"atk":"spa"),1); }
}
function onKO(attacker){
  if(!attacker||attacker.fainted) return;
  if(["MOXIE","CHILLINGNEIGH","GRIMNEIGH","BEASTBOOST"].includes(attacker.ability)){ const s=sideOf(attacker); if(s>=0) abilityBanner(s,abName(attacker)); }
  if(attacker.ability==="MOXIE"||attacker.ability==="CHILLINGNEIGH"){ pushLog(`<span class="eff">${escapeHtml(attacker.mon.display)}'s ${abName(attacker)}!</span>`); boost(attacker,"atk",1); }
  else if(attacker.ability==="GRIMNEIGH"){ pushLog(`<span class="eff">${escapeHtml(attacker.mon.display)}'s Grim Neigh!</span>`); boost(attacker,"spa",1); }
  else if(attacker.ability==="BEASTBOOST"){ const k=["atk","def","spa","spd","spe"].sort((a,b)=>eStat(attacker,b)-eStat(attacker,a))[0]; pushLog(`<span class="eff">${escapeHtml(attacker.mon.display)}'s Beast Boost!</span>`); boost(attacker,k,1); }
}

const teamHasMega=t=>t.some(m=>m.mega);
const teamHasGmax=t=>t.some(m=>m.gmax);
function freshBag(team){
  return {sash:1,sitrus:1,lefto:1,bulb:1,claw:1,
          mega:teamHasMega(team)?1:0, gmax:teamHasGmax(team)?1:0};
}
function startItemPhase(){
  S.players.forEach(p=>p.team.forEach(m=>{m.item=null;}));
  S.bags=[freshBag(S.players[0].team), freshBag(S.players[1].team)];
  if(S.players[1].ai) autoAssignItems(1);   // rival auto-assigns; humans use the UI
  S.itemSide=0; S.pickMon=null; S.screen="itembag"; render();
}
function autoAssignItems(side){
  const team=S.players[side].team, bag=S.bags[side];
  const free=()=>team.filter(m=>!m.item);
  const give=(m,k)=>{ if(m&&(bag[k]||0)>0&&!m.item){ m.item=k; bag[k]--; } };
  const st=m=>m.stats||{};
  if(bag.mega) give(team.find(m=>m.mega&&!m.item),"mega");
  if(bag.gmax) give(team.find(m=>m.gmax&&!m.item),"gmax");
  give([...free()].sort((a,b)=>Math.max(st(b).atk||0,st(b).spa||0)-Math.max(st(a).atk||0,st(a).spa||0))[0],"bulb");
  const bySpe=[...free()].sort((a,b)=>(st(b).spe||0)-(st(a).spe||0));
  give(bySpe[bySpe.length-1],"claw");   // slowest → Quick Claw
  give(bySpe[0],"sash");                // fastest → Focus Sash
  const byHp=[...free()].sort((a,b)=>(st(b).hp||0)-(st(a).hp||0));
  give(byHp[0],"lefto"); give(byHp[1]||byHp[0],"sitrus");
}
function assignItem(side,i,k){
  const team=S.players[side].team, bag=S.bags[side], m=team[i];
  if((bag[k]||0)<=0) return;
  if(m.item) bag[m.item]++;            // return whatever it held
  m.item=k; bag[k]--;
}
function clearItem(side,i){
  const m=S.players[side].team[i]; if(m.item){ S.bags[side][m.item]++; m.item=null; }

    e.stopPropagation(); clearItem(side,+el.dataset.clear); renderItemBag();
  });
  $("app").querySelectorAll(".ibag").forEach(bn=>{
    const k=bn.dataset.k;
    bn.onclick=()=>{

      const m=team[S.pickMon];

      if(k==="gmax"&&!m.gmax){ setDesc("Only a G-Max Pokémon can hold the G-Max Band."); return; }
      assignItem(side,S.pickMon,k); renderItemBag();
    };
  });
  $("idone").onclick=()=>{
    if(S.online){ submitOnlineTeam(); return; }                 // online: send my team, wait for opponent
    if(side===0 && !S.players[1].ai){ S.itemSide=1; S.pickMon=null; renderItemBag(); }
    else startBattle();
  };
  $("iskip").onclick=()=>{
    team.forEach((m,i)=>clearItem(side,i));
    if(S.online){ submitOnlineTeam(); return; }
    if(side===0 && !S.players[1].ai){ S.itemSide=1; S.pickMon=null; renderItemBag(); }
    else startBattle();
  };
}

// Make sure every battler has real base stats (and, for Megas/G-Max, the
// base-species stats they revert to without their stone).
async function prepareBattlers(){
  for(const side of [0,1]){
    for(const m of S.players[side].team){
      if((!m.stats||!m.stats.hp) && S.apiOk){ try{ const d=await fetchMon(m.name); m.stats=d.stats; }catch(e){} }
      if((m.mega||m.gmax) && !m.baseStats && S.apiOk){
        const base=speciesOf(m.name);
        if(base){ try{ const d=await fetchMon(base); m.baseStats=d.stats; }catch(e){} }
      }
    }
  }
}
async function startBattle(){
  S.screen="battle";
  $("app").innerHTML=`<div style="text-align:center;padding:70px 10px"><div class="spinner"></div><p class="loadline">Preparing battle…</p></div>`;

    names:[S.players[0].name, S.players[1].name],

    active:[0,0], log:[], recap:[], busy:false, over:false, winner:-1, auto:false, switching:false, clawMsg:null,

function shade(hex){ // darken a hex color for gradient
  const n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.floor(r*.7);g=Math.floor(g*.7);b=Math.floor(b*.7);
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function pushLog(html){

function effWord(e){
  if(e===0) return ' <span class="muted">It had no effect…</span>';
  if(e>=2)  return ' <span class="eff">It\'s super effective!</span>';
  if(e>0&&e<1) return ' <span class="muted">It\'s not very effective…</span>';

}

async function doTurn(action){
  const bt=S.bt; if(bt.busy||bt.over) return;
  if(typeof action==="number") action={type:"move",idx:action};
  if(!action) action={type:"move",idx:0};
  bt.busy=true; bt.switching=false; renderMoves();
  const auto = bt.ai[0]||bt.auto;

  // ---- player chooses to switch: it costs the turn, the foe still attacks ----
  if(action.type==="switch"){
    const outMon=activeB(0);
    outMon.entered=false; outMon.flashfire=false;   // re-triggers entry next time it comes in
    bt.active[0]=action.to;
    const inMon=activeB(0);
    paintPanel(0);
    pushLog(`<span class="muted">You withdrew ${escapeHtml(outMon.mon.display)} and sent out ${escapeHtml(inMon.mon.display)}!</span>`);
    beep(700,.08,"sine",.04); await wait(750);
    await onEntryAnim(0);
    const foe=activeB(1);
    if(!bt.over && !foe.fainted && !inMon.fainted){
      const can=await canAct(1,foe);
      if(can) await performMove(1, foe, inMon, bestMove(foe,inMon));
    }
    return afterTurn();
  }

  // ---- both sides attack ----
  const you=activeB(0), foe=activeB(1);
  const m0 = auto ? bestMove(you,foe) : you.moves[action.idx];
  const m1 = bestMove(foe,you);
  const sYou=eStat(you,"spe"), sFoe=eStat(foe,"spe");
  let first = sYou>sFoe ? 0 : sYou<sFoe ? 1 : (Math.random()<.5?0:1);
  const p0=prio(you,m0), p1=prio(foe,m1);
  if(p0!==p1){ first = p0>p1 ? 0 : 1; }             // priority moves override speed
  else {                                             // Quick Claw: slower side gets 20% to jump
    const slow=1-first, slowB=(slow===0?you:foe);
    if(slowB.item==="claw" && Math.random()<0.2){ first=slow; bt.clawMsg=slow; }
  }
  if(bt.clawMsg!=null){
    pushLog(`<span class="eff">${bt.clawMsg===0?"Your":escapeHtml(bt.names[1])+"'s"} ${escapeHtml((bt.clawMsg===0?you:foe).mon.display)}'s Quick Claw let it move first!</span>`);
    bt.clawMsg=null; await wait(650);
  }
  const seq = first===0 ? [[0,you,foe,m0],[1,foe,you,m1]] : [[1,foe,you,m1],[0,you,foe,m0]];
  for(const [aSide,atk,def,mv] of seq){
    if(atk.fainted||def.fainted) continue;
    const can=await canAct(aSide,atk);
    if(!can){ if(bt.over) break; continue; }
    await performMove(aSide,atk,def,mv);
    if(bt.over) break;
  }
  you.flinched=false; foe.flinched=false;
  return afterTurn();
}
// priority incl. Gale Wings / Prankster / Triage
function prio(bl,mv){
  let p=mv.pri||0;
  if(has(bl,"GALEWINGS")&&mv.type==="flying"&&bl.hp>=bl.max&&mv.power>0) p=Math.max(p,1);
  return p;
}
// status / flinch gate before a Pokémon acts
async function canAct(side,bl){
  if(bl.flinched){ bl.flinched=false; pushLog(`<span class="muted">${escapeHtml(bl.mon.display)} flinched and couldn't move!</span>`); await wait(600); return false; }
  if(bl.status==="frz"){
    if(Math.random()<0.2){ bl.status=null; setStatusUI(side); pushLog(`<span class="eff">${escapeHtml(bl.mon.display)} thawed out!</span>`); await wait(600); }
    else { pushLog(`<span class="muted">${escapeHtml(bl.mon.display)} is frozen solid!</span>`); await wait(600); return false; }
  }
  if(bl.status==="slp"){
    bl.sleepT-=(has(bl,"EARLYBIRD")||has(bl,"WAKEFULEYE"))?2:1;
    if(bl.sleepT<=0){ bl.status=null; bl.sleepT=0; setStatusUI(side); pushLog(`<span class="eff">${escapeHtml(bl.mon.display)} woke up!</span>`); await wait(600); }
    else { pushLog(`<span class="muted">${escapeHtml(bl.mon.display)} is fast asleep.</span>`); await wait(600); return false; }
  }
  if(bl.status==="par" && Math.random()<0.25){ pushLog(`<span class="muted">${escapeHtml(bl.mon.display)} is paralyzed! It can't move!</span>`); await wait(600); return false; }
  return true;
}
// show a floating ability banner, then run entry effects
async function onEntryAnim(side){
  const bl=activeB(side); if(!bl||bl.entered||bl.fainted) return;
  const nm=abName(bl);
  onEntry(side);
  if(nm) await wait(300);
}
async function afterTurn(){
  const bt=S.bt;
  if(!bt.over) await endOfTurn();       // Leftovers
  if(!bt.over) await handleFaints();
  bt.busy=false;
  if(bt.over){ setTimeout(showBattleResult,900); return; }
  paintPanel(0); paintPanel(1); renderMoves(); updateCount();
  if(bt.auto||bt.ai[0]) scheduleAuto(); else setPrompt();
}
async function performMove(side,atk,def,mv){
  const bt=S.bt, defSide=1-side;
  pushLog(`${escapeHtml(atk.mon.display)} used <b>${mv.name}</b>!`);
  beep(side===0?520:300,.05,"square",.04);
  await wait(320);

  // ---- status (non-damaging) moves ----
  if(mv.cls==="status"){
    const sm=mv.smove;
    if(!sm){ pushLog(`<span class="muted">But nothing happened…</span>`); await wait(500); return; }
    const targeted=!!(sm.foe||sm.status), acc=mv.acc==null?100:mv.acc;
    if(targeted && acc>0 && Math.random()*100>=acc){ pushLog(`<span class="muted">But it missed!</span>`); beep(180,.1,"square",.03); await wait(600); return; }
    beep(660,.06,"triangle",.04);
    if(sm.self){ for(const k in sm.self) boost(atk,k,sm.self[k]); await wait(450); }
    if(sm.foe){ for(const k in sm.foe) lower(def,k,sm.foe[k]); await wait(450); }
    if(sm.weather){ S.bt.weather={kind:sm.weather,turns:5}; const lbl={rain:"It started to rain!",sun:"The sunlight turned harsh!",sand:"A sandstorm kicked up!",snow:"It started to snow!"}[sm.weather]; pushLog(`<span class="eff">${lbl}</span>`); paintWeather(); await wait(500); }
    if(sm.heal){ if(atk.hp>=atk.max){ pushLog(`<span class="muted">But its HP is full!</span>`); } else { atk.hp=Math.min(atk.max,atk.hp+Math.round(atk.max*sm.heal)); setHp(side,true); pushLog(`<span class="eff">${escapeHtml(atk.mon.display)} regained health!</span>`); beep(880,.08,"triangle",.05); } await wait(500); }
    if(sm.rest){ atk.hp=atk.max; atk.status="slp"; atk.sleepT=2; setHp(side,true); setStatusUI(side); pushLog(`<span class="eff">${escapeHtml(atk.mon.display)} slept and became healthy!</span>`); await wait(500); }
    if(sm.bellydrum){ if(atk.hp>Math.floor(atk.max/2)){ atk.hp-=Math.floor(atk.max/2); setHp(side,true); atk.stages.atk=6; pushLog(`<span class="eff">${escapeHtml(atk.mon.display)} maxed its Attack!</span>`); } else pushLog(`<span class="muted">But it failed!</span>`); await wait(500); }
    if(sm.status){ const ok=inflict(def,sm.status); if(!ok){ pushLog(`<span class="muted">But it failed!</span>`); await wait(400); } }
    return;
  }

  // ---- absorbing / immunity abilities ----
  if(mv.power>0){
    const ab=absorbCheck(def,mv.type);
    if(ab){
      abilityBanner(defSide,abName(def));
      pushLog(`<span class="eff">${escapeHtml(def.mon.display)}'s ${abName(def)}!</span>`);
      if(ab.heal && def.hp<def.max){ def.hp=Math.min(def.max,def.hp+Math.round(def.max*ab.heal)); setHp(defSide,true); pushLog(`<span class="muted">It restored HP.</span>`); }
      if(ab.boost){ boost(def,ab.boost[0],ab.boost[1]); }
      if(ab.flashfire){ def.flashfire=true; pushLog(`<span class="muted">Its Fire power was boosted!</span>`); }
      await wait(650); return;
    }
  }

  // accuracy check (imported moves carry real accuracy; 0 or No Guard = never miss)
  const acc=mv.acc==null?100:mv.acc;
  if(acc>0 && !has(atk,"NOGUARD") && !has(def,"NOGUARD") && Math.random()*100>=acc){
    pushLog(`<span class="muted">${escapeHtml(atk.mon.display)}'s attack missed!</span>`); beep(180,.1,"square",.03); await wait(600); return;
  }
  const r=calcDamage(atk,def,mv);
  if(r.wonder){ pushLog(`<span class="muted">${escapeHtml(def.mon.display)}'s Wonder Guard blocked it!</span>`); await wait(650); return; }
  const wasFull=def.hp>=def.max, dealt=r.d;
  def.hp-=dealt;
  // Focus Sash / Sturdy — survive a KO from full HP
  let hung=false, sturdy=false;
  if(def.hp<=0 && wasFull){
    if(def.item==="sash" && !def.sashUsed){ def.hp=1; def.sashUsed=true; hung=true; }
    else if(has(def,"STURDY")){ def.hp=1; sturdy=true; }
  }
  const sp=$("spr"+defSide); if(sp){ sp.classList.add("hitflash"); setTimeout(()=>sp.classList.remove("hitflash"),400); }
  if(dealt>0 && r.eff>0) flashType(mv.type);
  setHp(defSide,true);
  let extra=effWord(r.eff)+(r.crit&&r.eff>0?' <span class="crit">A critical hit!</span>':"");
  if(extra) pushLog(extra.trim());
  await wait(500);
  if(hung){ pushLog(`<span class="eff">${escapeHtml(def.mon.display)} hung on with its Focus Sash!</span>`); beep(900,.08,"triangle",.05); await wait(600); }
  if(sturdy){ pushLog(`<span class="eff">${escapeHtml(def.mon.display)} endured the hit with Sturdy!</span>`); beep(900,.08,"triangle",.05); await wait(600); }

  // ---- self effects (apply even on KO) ----
  if(dealt>0 && mv.drain){
    if(has(def,"LIQUIDOOZE")){ atk.hp=Math.max(0,atk.hp-Math.round(dealt*mv.drain)); setHp(side,true); pushLog(`<span class="muted">${escapeHtml(atk.mon.display)} was hurt by Liquid Ooze!</span>`); }
    else if(atk.hp<atk.max){ atk.hp=Math.min(atk.max,atk.hp+Math.round(dealt*mv.drain)); setHp(side,true); pushLog(`<span class="muted">${escapeHtml(atk.mon.display)} drained HP.</span>`); }
    await wait(450);
  }
  if(dealt>0 && mv.recoil && !has(atk,"ROCKHEAD") && !has(atk,"MAGICGUARD")){
    atk.hp=Math.max(0,atk.hp-Math.max(1,Math.round(dealt*mv.recoil))); setHp(side,true);
    pushLog(`<span class="muted">${escapeHtml(atk.mon.display)} is hit with recoil!</span>`); await wait(450);
  }
  if(mv.selfdrop){ for(const k in mv.selfdrop) boost(atk,k,mv.selfdrop[k]); }

  // Self Destruct / Explosion - user faints
  if(["Self-Destruct","Explosion"].includes(mv.name) && !has(atk,"MAGICGUARD")){
    atk.hp=0; atk.fainted=true; setHp(side,true);
    const sa=$("spr"+side); if(sa) sa.classList.add("fainted");
    pushLog(`<span class="muted">${escapeHtml(atk.mon.display)} used ${mv.name} and fainted!</span>`); await wait(600);
  }

  // Sitrus Berry
  if(def.hp>0 && def.item==="sitrus" && !def.sitrusUsed && def.hp<=def.max/2){
    def.sitrusUsed=true; def.hp=Math.min(def.max,def.hp+Math.round(def.max/4)); setHp(defSide,true);
    pushLog(`<span class="eff">${escapeHtml(def.mon.display)} ate its Sitrus Berry!</span>`); beep(880,.08,"triangle",.05); await wait(600);
  }

  // ---- on-hit effects (target must survive & be hit) ----
  if(def.hp>0 && r.eff>0 && dealt>0 && mv.power>0){ await applyOnHit(side,atk,def,mv); }

  // ---- faints ----
  if(def.hp<=0){
    def.hp=0; def.fainted=true; setHp(defSide,true);
    const sd=$("spr"+defSide); if(sd) sd.classList.add("fainted");
    pushLog(`<span class="muted">${escapeHtml(def.mon.display)} fainted!</span>`);
    beep(160,.25,"sawtooth",.05); await wait(600);
    if(isContact(mv) && has(def,"AFTERMATH") && !atk.fainted){ atk.hp=Math.max(0,atk.hp-Math.round(atk.max/4)); setHp(side,true); pushLog(`<span class="muted">${escapeHtml(atk.mon.display)} was hurt by Aftermath!</span>`); await wait(500); }
    onKO(atk);
  }
  if(atk.hp<=0 && !atk.fainted){
    atk.hp=0; atk.fainted=true; setHp(side,true);
    const sa=$("spr"+side); if(sa) sa.classList.add("fainted");
    pushLog(`<span class="muted">${escapeHtml(atk.mon.display)} fainted!</span>`); await wait(600);
  }
}
async function applyOnHit(side,atk,def,mv){
  const contact=isContact(mv), defSide=1-side;
  // defender's contact retaliation onto the attacker
  if(contact && !atk.fainted){
    if(has(def,"ROUGHSKIN")||has(def,"IRONBARBS")){
      atk.hp=Math.max(0,atk.hp-Math.round(atk.max/8)); setHp(side,true);
      pushLog(`<span class="muted">${escapeHtml(atk.mon.display)} was hurt by ${abName(def)}!</span>`); await wait(450);
    }
    if((has(def,"GOOEY")||has(def,"TANGLINGHAIR"))){ pushLog(`<span class="eff">${escapeHtml(def.mon.display)}'s ${abName(def)}!</span>`); lower(atk,"spe",1,false); await wait(350); }
    const cs={STATIC:"par",FLAMEBODY:"brn",POISONPOINT:"psn"}[def.ability];
    if(cs && Math.random()<0.3) inflict(atk,cs);
    else if(def.ability==="EFFECTSPORE" && Math.random()<0.3) inflict(atk, ["psn","par","slp"][Math.floor(Math.random()*3)]);
  }
  // attacker's Poison Touch onto the defender
  if(contact && atk.ability==="POISONTOUCH" && Math.random()<0.3) inflict(def,"psn");
  // Weak Armor reaction
  if(mv.cls==="physical" && has(def,"WEAKARMOR")){ pushLog(`<span class="eff">${escapeHtml(def.mon.display)}'s Weak Armor!</span>`); lower(def,"def",1,false); boost(def,"spe",2); await wait(350); }
  // move secondary effects onto the defender
  if(!(has(atk,"SHEERFORCE")&&hasSecondary(mv)) && !has(def,"SHIELDDUST")){
    const sg=has(atk,"SERENEGRACE")?2:1;
    if(mv.status && Math.random()<Math.min(1,(mv.chance||1)*sg)) inflict(def,mv.status);
    if(mv.drop && Math.random()<Math.min(1,(mv.chance||1)*sg)){ for(const k in mv.drop) lower(def,k,mv.drop[k]); await wait(300); }
    if(mv.flinch && Math.random()<Math.min(1,mv.flinch*sg) && !has(def,"INNERFOCUS")) def.flinched=true;
  }
  // attacker self-boost (e.g. Meteor Mash)
  if(mv.selfboost && Math.random()<(mv.chance||1)){ for(const k in mv.selfboost) boost(atk,k,mv.selfboost[k]); }
}
async function endOfTurn(){
  const bt=S.bt;
  const heal=async(b,side,amt,msg)=>{ if(b.hp>=b.max||b.fainted)return; b.hp=Math.min(b.max,b.hp+Math.max(1,amt)); setHp(side,true); pushLog(`<span class="muted">${msg}</span>`); beep(760,.06,"sine",.03); await wait(450); };
  const hurt=async(b,side,amt,msg)=>{ if(b.fainted||has(b,"MAGICGUARD"))return; b.hp=Math.max(0,b.hp-Math.max(1,amt)); setHp(side,true); pushLog(`<span class="muted">${msg}</span>`); await wait(450);
    if(b.hp<=0){ b.hp=0; b.fainted=true; const sd=$("spr"+side); if(sd) sd.classList.add("fainted"); pushLog(`<span class="muted">${escapeHtml(b.mon.display)} fainted!</span>`); await wait(500); } };
  // ---- weather ----
  const w=weatherActive();
  if(w){
    for(const side of [0,1]){ const b=activeB(side); if(b.fainted) continue;
      const T=b.mon.types;
      if(w==="sand" && !(T.includes("rock")||T.includes("ground")||T.includes("steel")) && !has(b,"OVERCOAT")&&!has(b,"SANDVEIL")&&!has(b,"SANDRUSH")&&!has(b,"SANDFORCE")) await hurt(b,side,Math.round(b.max/16),`${escapeHtml(b.mon.display)} is buffeted by the sandstorm!`);
      if(w==="rain"){ if(has(b,"RAINDISH")||has(b,"DRYSKIN")) await heal(b,side,Math.round(b.max/16),`${escapeHtml(b.mon.display)} is healed by the rain.`); }
      if(w==="sun"){ if(has(b,"DRYSKIN")||has(b,"SOLARPOWER")) await hurt(b,side,Math.round(b.max/8),`${escapeHtml(b.mon.display)} suffers in the harsh sun.`); }
      if(w==="snow"){ if(has(b,"ICEBODY")) await heal(b,side,Math.round(b.max/16),`${escapeHtml(b.mon.display)} is healed by the snow.`); }
    }
    if(S.bt.weather.turns>0){ S.bt.weather.turns--; if(S.bt.weather.turns<=0){ pushLog(`<span class="muted">The weather cleared up.</span>`); S.bt.weather=null; paintWeather(); await wait(400); } }
  }
  // ---- status + items ----
  for(const side of [0,1]){
    const b=activeB(side); if(b.fainted) continue;
    if(b.item==="lefto") await heal(b,side,Math.round(b.max/16),`${escapeHtml(b.mon.display)} restored a little HP with Leftovers.`);
    if(b.status==="brn") await hurt(b,side,Math.round(b.max/16),`${escapeHtml(b.mon.display)} is hurt by its burn!`);
    else if(b.status==="psn"){ if(has(b,"POISONHEAL")) await heal(b,side,Math.round(b.max/8),`${escapeHtml(b.mon.display)} is healed by Poison Heal.`); else await hurt(b,side,Math.round(b.max/8),`${escapeHtml(b.mon.display)} is hurt by poison!`); }
    else if(b.status==="tox"){ if(has(b,"POISONHEAL")) await heal(b,side,Math.round(b.max/8),`${escapeHtml(b.mon.display)} is healed by Poison Heal.`); else { await hurt(b,side,Math.round(b.max*b.toxicN/16),`${escapeHtml(b.mon.display)} is hurt by poison!`); b.toxicN=Math.min(15,b.toxicN+1); } }
    if(!b.fainted && has(b,"SPEEDBOOST") && b.entered){ boost(b,"spe",1); await wait(350); }
  }
}
async function handleFaints(){
  const bt=S.bt;
  for(let side=0;side<2;side++){
    if(activeB(side).fainted){
      const next=bt.teams[side].findIndex(x=>!x.fainted);
      if(next<0){ bt.over=true; bt.winner=1-side; return; }
      bt.active[side]=next;
      paintPanel(side);
      const who = bt.online ? escapeHtml(bt.names[side]) : (side===0 ? "You" : escapeHtml(bt.names[1]));
      pushLog(`<span class="muted">${who} sent out ${escapeHtml(activeB(side).mon.display)}!</span>`);
      beep(700,.08,"sine",.04);
      await wait(650);
      await onEntryAnim(side);
    }
  }
}
function scheduleAuto(){
  const bt=S.bt; if(bt.over||bt.busy) return;
  setTimeout(()=>{ if(!bt.over && !bt.busy && (bt.auto||bt.ai[0])) doTurn(0); }, 700);
}

function initFirebase(){

    firebase.initializeApp(FIREBASE_CONFIG);
    FBauth=firebase.auth(); FBdb=firebase.database();
    FBauth.onAuthStateChanged(async u=>{
      if(u){ await loadProfile(u); } else { ME=null; }
      if(S.screen==="setup") renderSetup();
