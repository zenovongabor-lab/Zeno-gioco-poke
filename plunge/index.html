<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">
<title>Plunge · the daily dive</title>
<meta name="description" content="A daily trivia dive where the rarest answers take you deepest.">
<meta name="theme-color" content="#0a3a5c">
<style>
  :root {
    --ink: #eaf7ff;
    --muted: #9cc3d8;
    --card: rgba(4, 22, 38, .62);
    --line: rgba(160, 220, 255, .22);
    --accent: #5ee6d0;
    --warn: #ff7a6b;
    --t0: #6b7c88;   /* miss */
    --t1: #8fd3ff;   /* plankton */
    --t2: #5ee6d0;   /* schooler */
    --t3: #b98cff;   /* rare */
    --t4: #ff9de2;   /* deep cut */
    --t5: #ffd36b;   /* abyssal */
    --sea: #4fb8e0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--sea);
    color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow-x: hidden;
    transition: background-color 1.6s ease;
    -webkit-tap-highlight-color: transparent;
  }
  #sea {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(0,0,0,.25));
    overflow: hidden;
  }
  #rays {
    position: absolute; inset: -20% -10% auto -10%; height: 70%;
    background: repeating-linear-gradient(100deg, rgba(255,255,255,.07) 0 40px, transparent 40px 110px);
    filter: blur(6px); transition: opacity 1.6s;
    animation: sway 9s ease-in-out infinite alternate;
  }
  @keyframes sway { from { transform: translateX(-30px) skewX(-4deg); } to { transform: translateX(30px) skewX(4deg); } }
  .bubble {
    position: absolute; bottom: -20px; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,.45); background: rgba(255,255,255,.06);
    animation: rise linear forwards;
  }
  @keyframes rise { to { transform: translate(var(--dx), -115vh); opacity: .1; } }
  .critter {
    position: absolute; font-size: 34px; opacity: .55; filter: saturate(.7);
    animation: swim linear forwards;
  }
  @keyframes swim { from { transform: translateX(-12vw) scaleX(var(--flip)); } to { transform: translateX(112vw) scaleX(var(--flip)); } }
  .critter.glow { filter: drop-shadow(0 0 10px #8ff) saturate(1.2); opacity: .8; }

  #app {
    position: relative; z-index: 1; min-height: 100%;
    max-width: 560px; margin: 0 auto; padding: 16px 16px 40px;
    display: flex; flex-direction: column;
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
  .logo { font-weight: 900; letter-spacing: .02em; font-size: 22px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .logo svg { width: 28px; height: 28px; }
  .depthpill {
    font-variant-numeric: tabular-nums; background: var(--card); border: 1px solid var(--line);
    padding: 6px 12px; border-radius: 999px; font-weight: 800; font-size: 14px; white-space: nowrap;
    backdrop-filter: blur(6px);
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 22px;
    padding: 20px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 18px 50px rgba(0,0,0,.25);
  }
  h1 { font-size: clamp(40px, 12vw, 64px); line-height: .95; margin: 8px 0 6px; letter-spacing: -.02em; font-weight: 900; }
  h2 { margin: 0 0 8px; font-size: 22px; }
  p { line-height: 1.5; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  button {
    font: inherit; cursor: pointer; border: 0; border-radius: 16px; padding: 14px 18px;
    font-weight: 800; font-size: 16px; color: #022; background: var(--accent);
    transition: transform .08s, filter .2s;
  }
  button:active { transform: scale(.97); }
  button:disabled { filter: grayscale(1) brightness(.7); cursor: default; }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button.big { width: 100%; padding: 18px; font-size: 18px; }
  .stack { display: grid; gap: 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > * { flex: 1; }
  .packs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pack { text-align: left; background: rgba(255,255,255,.08); color: var(--ink); border: 1px solid var(--line); padding: 14px; }
  .pack b { display: block; font-size: 15px; }
  .pack span { font-size: 12px; font-weight: 600; color: var(--muted); }
  .pack i { font-style: normal; font-size: 22px; display: block; margin-bottom: 4px; }

  .tiers { display: grid; gap: 6px; margin: 10px 0 0; padding: 0; list-style: none; }
  .tiers li { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-weight: 800; font-size: 13px; color: #021; }

  /* play */
  .meta { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); font-weight: 700; margin-bottom: 10px; }
  .dots { display: flex; gap: 5px; }
  .dots span { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.18); }
  .dots span.on { background: var(--ink); }
  .prompt-wrap { display: flex; align-items: center; gap: 16px; }
  .prompt { font-size: clamp(24px, 7vw, 34px); font-weight: 900; line-height: 1.1; flex: 1; margin: 4px 0; }
  .cat { text-transform: uppercase; letter-spacing: .12em; font-size: 11px; font-weight: 800; color: var(--accent); }
  .timer { position: relative; width: 74px; height: 74px; flex: none; }
  .timer svg { transform: rotate(-90deg); width: 100%; height: 100%; }
  .timer circle { fill: none; stroke-width: 7; }
  .timer .track { stroke: rgba(255,255,255,.14); }
  .timer .bar { stroke: var(--accent); stroke-linecap: round; transition: stroke .3s; }
  .timer b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 24px; font-variant-numeric: tabular-nums; }
  .timer.low .bar { stroke: var(--warn); }
  .timer.low b { color: var(--warn); animation: pulse .5s ease-in-out infinite alternate; }
  @keyframes pulse { to { transform: scale(1.15); } }
  form { display: flex; gap: 8px; margin-top: 16px; }
  input[type=text] {
    flex: 1; min-width: 0; font: inherit; font-size: 20px; font-weight: 700; color: var(--ink);
    background: rgba(255,255,255,.1); border: 2px solid var(--line); border-radius: 16px; padding: 14px 16px; outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  input::placeholder { color: rgba(234,247,255,.4); }
  .shake { animation: shake .35s; }
  @keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
  .feedback { min-height: 22px; margin-top: 10px; font-size: 14px; font-weight: 700; color: var(--warn); }
  .tried { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .tried span { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: rgba(255,122,107,.18); color: #ffc2ba; text-decoration: line-through; }
  .skip { margin-top: 12px; background: none; color: var(--muted); font-size: 13px; padding: 6px; text-decoration: underline; }

  /* reveal */
  .reveal { text-align: center; }
  .reveal .you { font-size: 30px; font-weight: 900; margin: 6px 0; text-transform: capitalize; }
  .reveal .chip { font-size: 16px; padding: 6px 14px; }
  .reveal .pts { font-size: 54px; font-weight: 900; margin: 8px 0 0; font-variant-numeric: tabular-nums; }
  .reveal .meters { color: var(--muted); font-weight: 700; }
  .spectrum { margin-top: 16px; text-align: left; display: grid; gap: 8px; }
  .spectrum div { display: flex; gap: 8px; align-items: baseline; font-size: 14px; }
  .spectrum .chip { font-size: 11px; padding: 2px 8px; flex: none; min-width: 84px; justify-content: center; }
  .spectrum span.ex { color: var(--ink); text-transform: capitalize; }
  .pop { animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(.5); opacity: 0; } }

  /* results */
  .grid-emoji { font-size: 30px; letter-spacing: 4px; margin: 6px 0; }
  .bigdepth { font-size: clamp(48px, 15vw, 76px); font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
  .zone { font-weight: 800; color: var(--accent); }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; margin: 14px 0; }
  .stats b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .stats span { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  .log { display: grid; gap: 6px; margin-top: 10px; text-align: left; }
  .log div { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; border-top: 1px solid var(--line); padding-top: 6px; }
  .log div em { font-style: normal; color: var(--muted); text-transform: capitalize; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 9;
    background: #fff; color: #022; font-weight: 800; padding: 10px 16px; border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,.3); animation: pop .3s;
  }

  /* depth gauge */
  #gauge {
    position: fixed; right: 10px; top: 80px; bottom: 80px; width: 6px; z-index: 1;
    background: rgba(255,255,255,.15); border-radius: 6px;
  }
  #gauge .sub {
    position: absolute; right: -6px; width: 18px; height: 18px; transform: translateY(-50%);
    transition: top 1.6s cubic-bezier(.3,.9,.3,1);
  }
  #gauge .tick { position: absolute; right: 10px; font-size: 9px; color: rgba(255,255,255,.5); font-weight: 800; transform: translateY(-50%); white-space: nowrap; }
  @media (max-width: 620px) { #gauge { display: none; } }
  @media (prefers-reduced-motion: reduce) { #rays, .bubble, .critter { animation: none !important; display: none; } }
</style>

  { at: 200,  name: 'Twilight Zone', color: [22, 96, 150] },
  { at: 1000, name: 'Midnight Zone', color: [10, 38, 74] },
  { at: 4000, name: 'Abyssal Zone',  color: [5, 14, 34] },
  { at: 6000, name: 'Hadal Zone',    color: [2, 4, 12] },
];

const SECONDS = 20, ROUNDS = 7, METERS_PER_POINT = 10, LIVES = 3;
const EPOCH = Date.UTC(2026, 0, 1);

/* ---------------- text matching ---------------- */
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/&/g, ' and ').replace(/['’`.]/g, '').replace(/[^a-z0-9]+/g, ' ').trim()
  .replace(/^(the|a|an) /, '').replace(/ /g, '');

function lev(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    let best = i;
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      best = Math.min(best, cur[j]);
    }
    if (best > max) return max + 1;
    prev = cur;
  }
  return prev[b.length];
}

function compile([pack, q, ...tiers]) {
  const keys = new Map(), lists = [];
  tiers.forEach((list, i) => {
    const names = [];
    list.split(',').map(s => s.trim()).filter(Boolean).forEach(entry => {
      const aliases = entry.split('/');
      names.push(aliases[0]);
      // Earlier (more common) tiers win when an answer is listed twice.
      aliases.forEach(a => { const k = norm(a); if (k && !keys.has(k)) keys.set(k, { tier: i + 1, name: aliases[0] }); });
    });
    lists.push(names);
  });
  return { pack, q, keys, lists };
}
const PROMPTS = BANK.map(compile);

function lookup(prompt, raw) {
  const k = norm(raw);
  if (!k) return null;
  const variants = [k, k.replace(/es$/, ''), k.replace(/s$/, ''), k + 's', k + 'es'];
  for (const v of variants) if (prompt.keys.has(v)) return prompt.keys.get(v);
  if (k.length < 5) return null;
  const tol = k.length >= 9 ? 2 : 1;
  let best = null, bestD = tol + 1;
  for (const [key, hit] of prompt.keys) {
    if (key.length < 4) continue;
    const d = lev(k, key, tol);
    if (d < bestD || (d === bestD && best && hit.tier < best.tier)) { best = hit; bestD = d; }
  }
  return bestD <= tol ? best : null;
}

/* ---------------- seeded randomness ---------------- */
function rng(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function shuffle(arr, rand = Math.random) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const todayKey = () => new Date().toISOString().slice(0, 10);
const dayNumber = () => Math.floor((Date.now() - EPOCH) / 86400000) + 1;
function dailyPrompts() {
  // A fresh shuffle every pass through the bank so consecutive days never repeat.
  const n = dayNumber(), per = Math.floor(PROMPTS.length / ROUNDS);
  const cycle = Math.floor((n - 1) / per), slot = (n - 1) % per;
  const order = shuffle(PROMPTS.map((_, i) => i), rng(cycle * 7919 + 17));
  return order.slice(slot * ROUNDS, slot * ROUNDS + ROUNDS).map(i => PROMPTS[i]);
}

/* ---------------- storage (best-effort) ---------------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('plunge:' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('plunge:' + k, JSON.stringify(v)); } catch {} },
};

/* ---------------- ocean ambience ---------------- */
const zoneFor = m => ZONES.reduce((z, cur) => m >= cur.at ? cur : z, ZONES[0]);
function seaColor(m) {
  let i = 0;
  while (i < ZONES.length - 1 && m >= ZONES[i + 1].at) i++;
  const a = ZONES[i], b = ZONES[i + 1] || a;
  const t = b === a ? 0 : (m - a.at) / (b.at - a.at);
  return `rgb(${a.color.map((c, k) => Math.round(c + (b.color[k] - c) * t)).join(',')})`;
}
let currentDepth = 0;
function setDepth(m) {
  currentDepth = m;
  document.body.style.backgroundColor = seaColor(m);
  document.getElementById('rays').style.opacity = Math.max(0, 1 - m / 900);
  const sub = document.querySelector('#gauge .sub');
  if (sub) sub.style.top = Math.min(100, m / 70) + '%';
  const pill = document.querySelector('.depthpill');
  if (pill) pill.textContent = `${Math.round(m).toLocaleString()} m`;
}
function buildGauge() {
  const g = document.getElementById('gauge');
  g.innerHTML = ZONES.map(z => `<div class="tick" style="top:${z.at / 70}%">${z.at}m</div>`).join('') +
    `<div class="tick" style="top:100%">7000m</div><div class="sub">${SUB_SVG}</div>`;
}
const SUB_SVG = `<svg viewBox="0 0 24 24"><ellipse cx="12" cy="13" rx="9" ry="6" fill="#ffd36b"/><rect x="10" y="4" width="4" height="5" rx="1" fill="#ffd36b"/><circle cx="14" cy="13" r="2.6" fill="#0a3a5c" stroke="#fff" stroke-width="1"/><path d="M3 13 L0 10 L0 16Z" fill="#ffb347"/></svg>`;

const CRITTERS = [
  [0, ['🐠', '🐟', '🐡', '🐢']], [200, ['🦈', '🐬', '🪼', '🦑']],
  [1000, ['🦑', '🪼', '🐙']], [4000, ['🪼', '🦐']], [6000, ['🪼']],
];
function ambience() {
  const sea = document.getElementById('sea');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  setInterval(() => {
    if (document.hidden || sea.childElementCount > 40) return;
    const b = document.createElement('div');
    const s = 4 + Math.random() * 14;
    b.className = 'bubble';
    Object.assign(b.style, { width: s + 'px', height: s + 'px', left: Math.random() * 100 + 'vw', animationDuration: 6 + Math.random() * 8 + 's' });
    b.style.setProperty('--dx', (Math.random() * 60 - 30) + 'px');
    sea.appendChild(b);
    b.addEventListener('animationend', () => b.remove());
  }, 450);
  setInterval(() => {
    if (document.hidden) return;
    const set = CRITTERS.reduce((acc, [at, list]) => currentDepth >= at ? list : acc, CRITTERS[0][1]);
    const c = document.createElement('div');
    c.className = 'critter' + (currentDepth >= 1000 ? ' glow' : '');
    c.textContent = set[Math.floor(Math.random() * set.length)];
    c.style.top = 15 + Math.random() * 70 + 'vh';
    c.style.animationDuration = 18 + Math.random() * 14 + 's';
    c.style.setProperty('--flip', '-1');
    sea.appendChild(c);
    c.addEventListener('animationend', () => c.remove());
  }, 5200);
}

/* ---------------- rendering helpers ---------------- */
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const chip = t => `<span class="chip" style="background:${TIERS[t].color}">${TIERS[t].emoji} ${TIERS[t].name}</span>`;
const LOGO = `<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="none" stroke="#5ee6d0" stroke-width="2"/><path d="M16 5v18m-6-6 6 7 6-7" fill="none" stroke="#eaf7ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function shell(body, depthPill = true) {
  app.innerHTML = `<header><div class="logo" onclick="home()">${LOGO}Plunge</div>${depthPill ? `<div class="depthpill">${Math.round(currentDepth).toLocaleString()} m</div>` : ''}</header>${body}`;
}
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1800);
}

/* ---------------- home ---------------- */
function home() {
  stopTimer();
  setDepth(0);
  const done = store.get('daily:' + todayKey());
  const st = stats();
  shell(`
    <div class="card">
      <div class="cat">Daily trivia · No. ${dayNumber()}</div>
      <h1>The rarer the answer, the deeper you dive.</h1>
      <p class="muted">Seven prompts. ${SECONDS} seconds each. Common answers keep you near the surface — answers nobody else thinks of take you down to the trench at 7,000 m.</p>
      <div class="stack">
        ${done
          ? `<button class="big" onclick="showDaily()">See today's dive · ${done.depth.toLocaleString()} m</button>`
          : `<button class="big" onclick="start('daily')">Start today's dive</button>`}
        <button class="big ghost" onclick="start('endless')">∞ Endless dive <span class="small muted">· ${LIVES} lives</span></button>
      </div>
    </div>

    <div class="card" style="margin-top:14px">
      <h2>Themed packs</h2>
      <div class="packs">
        ${Object.entries(PACKS).map(([k, p]) => `<button class="pack" onclick="start('pack','${k}')"><i>${p.icon}</i><b>${p.name}</b><span>${PROMPTS.filter(x => x.pack === k).length} prompts</span></button>`).join('')}
      </div>
    </div>

    <div class="card" style="margin-top:14px">
      <h2>How scoring works</h2>
      <p class="muted small" style="margin:0">Type any valid answer. If it isn't in the answer bank you can keep trying until time runs out. Every point = ${METERS_PER_POINT} m of depth.</p>
      <ul class="tiers">
        ${TIERS.slice(1).map((t, i) => `<li>${chip(i + 1)}<b>${t.pts} pts</b><span class="muted small">${['what most people say', 'a solid, popular pick', 'off the beaten path', 'few divers find these', 'the one hidden answer per prompt'][i]}</span></li>`).join('')}
      </ul>
    </div>

    ${st.played ? `<div class="card" style="margin-top:14px"><h2>Your log</h2>${statsHtml(st)}</div>` : ''}
    <p class="small muted" style="text-align:center;margin-top:18px">A new dive surfaces every day at 00:00 UTC.</p>
  `);
}

/* ---------------- game state ---------------- */
let G = null, timer = null;
function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }

function start(mode, pack) {
  let queue;
  if (mode === 'daily') {
    if (store.get('daily:' + todayKey())) return showDaily();
    queue = dailyPrompts();
  } else if (mode === 'pack') {
    queue = shuffle(PROMPTS.filter(p => p.pack === pack)).slice(0, ROUNDS);
  } else {
    queue = shuffle(PROMPTS);
  }
  G = { mode, pack, queue, i: 0, results: [], points: 0, lives: LIVES };
  setDepth(0);
  ask();
}

function ask() {
  const p = G.queue[G.i];
  const total = G.mode === 'endless' ? null : G.queue.length;
  let left = SECONDS, answered = false;
  const tried = [];
  shell(`
    <div class="card" id="play">
      <div class="meta">
        <span>${G.mode === 'endless' ? `Prompt ${G.i + 1} · ${'❤️'.repeat(G.lives)}${'🖤'.repeat(LIVES - G.lives)}` : `Prompt ${G.i + 1} of ${total}`}</span>
        ${total ? `<div class="dots">${G.queue.map((_, k) => `<span class="${k <= G.i ? 'on' : ''}"></span>`).join('')}</div>` : `<span>${G.points} pts</span>`}
      </div>
      <div class="cat">${PACKS[p.pack].icon} ${PACKS[p.pack].name}</div>
      <div class="prompt-wrap">
        <div class="prompt">${esc(p.q)}…</div>
        <div class="timer" id="timer"><svg viewBox="0 0 80 80"><circle class="track" cx="40" cy="40" r="34"/><circle class="bar" id="bar" cx="40" cy="40" r="34" stroke-dasharray="213.6" stroke-dashoffset="0"/></svg><b id="secs">${SECONDS}</b></div>
      </div>
      <form id="f" autocomplete="off">
        <input type="text" id="ans" placeholder="Your answer" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" maxlength="60">
        <button type="submit">Dive</button>
      </form>
      <div class="feedback" id="fb"></div>
      <div class="tried" id="tried"></div>
      <button class="skip" id="skip">Give up on this one</button>
    </div>`);
  const input = document.getElementById('ans');
  input.focus();

  const finish = (hit, guess) => {
    if (answered) return;
    answered = true;
    stopTimer();
    resolve(p, hit, guess);
  };

  document.getElementById('f').onsubmit = e => {
    e.preventDefault();
    const v = input.value.trim();
    if (!v) return;
    const hit = lookup(p, v);
    if (hit) return finish(hit, v);
    if (!tried.includes(v.toLowerCase())) tried.push(v.toLowerCase());
    document.getElementById('fb').textContent = 'Not in the answer bank — try another!';
    document.getElementById('tried').innerHTML = tried.map(t => `<span>${esc(t)}</span>`).join('');
    const card = document.getElementById('play');
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    input.select();
  };
  document.getElementById('skip').onclick = () => finish(null, '');

  const t0 = Date.now();
  timer = setInterval(() => {
    left = Math.max(0, SECONDS - (Date.now() - t0) / 1000);
    document.getElementById('secs').textContent = Math.ceil(left);
    document.getElementById('bar').setAttribute('stroke-dashoffset', 213.6 * (1 - left / SECONDS));
    document.getElementById('timer').classList.toggle('low', left <= 5);
    if (left <= 0) finish(null, '');
  }, 100);
}

function resolve(p, hit, guess) {
  const tier = hit ? hit.tier : 0, pts = TIERS[tier].pts;
  G.results.push({ q: p.q, tier, answer: hit ? hit.name : null, pts });
  G.points += pts;
  if (G.mode === 'endless' && tier === 0) G.lives--;
  const before = currentDepth;
  setDepth(G.points * METERS_PER_POINT);
  const crossed = zoneFor(currentDepth) !== zoneFor(before);

  const sample = (t, n) => shuffle(p.lists[t - 1].filter(a => !hit || a !== hit.name)).slice(0, n).join(', ');
  const last = G.mode === 'endless' ? G.lives <= 0 : G.i + 1 >= G.queue.length;
  shell(`
    <div class="card reveal pop">
      <div class="cat">${esc(p.q)}</div>
      ${hit ? `<div class="you">${esc(hit.name)}</div>` : `<div class="you" style="color:var(--muted)">${guess ? esc(guess) : 'Time ran out'}</div>`}
      <div>${chip(tier)}</div>
      <div class="pts" style="color:${TIERS[tier].color}">+${pts}</div>
      <div class="meters">${pts ? `▼ ${pts * METERS_PER_POINT} m deeper` : 'You hold your depth.'}${crossed ? ` · entering the <b class="zone">${zoneFor(currentDepth).name}</b>` : ''}</div>
      <div class="spectrum">
        <div>${chip(1)}<span class="ex">${esc(sample(1, 3))}</span></div>
        <div>${chip(3)}<span class="ex">${esc(sample(3, 3))}</span></div>
        <div>${chip(4)}<span class="ex">${esc(sample(4, 3))}</span></div>
        <div>${chip(5)}<span class="ex">${tier === 5 ? 'You found it!' : esc(p.lists[4][0])}</span></div>
      </div>
      <button class="big" id="next" style="margin-top:18px">${last ? 'Surface & see results' : 'Next prompt ▼'}</button>
    </div>`);
  const next = document.getElementById('next');
  next.focus();
  next.onclick = () => {
    if (last) return results();
    G.i++;
    if (G.mode === 'endless' && G.i >= G.queue.length) { G.queue = G.queue.concat(shuffle(PROMPTS)); }
    ask();
  };
}

/* ---------------- results & stats ---------------- */
function stats() { return store.get('stats', { played: 0, streak: 0, best: 0, total: 0, last: null, endlessBest: 0 }); }
function statsHtml(st) {
  return `<div class="stats">
    <div><b>${st.played}</b><span>Dives</span></div>
    <div><b>${st.streak}</b><span>Streak</span></div>
    <div><b>${st.best.toLocaleString()}</b><span>Best m</span></div>
    <div><b>${st.played ? Math.round(st.total / st.played).toLocaleString() : 0}</b><span>Avg m</span></div>
  </div>${st.endlessBest ? `<p class="small muted" style="text-align:center;margin:0">Endless record: ${st.endlessBest.toLocaleString()} m</p>` : ''}`;
}

function results() {
  const depth = G.points * METERS_PER_POINT;
  const st = stats();
  if (G.mode === 'daily') {
    const key = todayKey();
    const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
    st.streak = st.last === yesterday ? st.streak + 1 : 1;
    st.last = key; st.played++; st.total += depth; st.best = Math.max(st.best, depth);
    store.set('daily:' + key, { depth, points: G.points, results: G.results, day: dayNumber() });
  } else if (G.mode === 'endless') {
    st.endlessBest = Math.max(st.endlessBest || 0, depth);
  }
  store.set('stats', st);
  renderResults({ depth, points: G.points, results: G.results, day: dayNumber() }, G.mode, G.pack);
}

function showDaily() {
  const d = store.get('daily:' + todayKey());
  if (!d) return home();
  renderResults(d, 'daily');
}

function renderResults(d, mode, pack) {
  setDepth(d.depth);
  const zone = zoneFor(d.depth);
  const title = mode === 'daily' ? `Daily dive No. ${d.day}` : mode === 'endless' ? 'Endless dive' : `${PACKS[pack].name} pack`;
  const max = d.results.length * 100;
  const share = `Plunge · ${title}\n${d.results.map(r => TIERS[r.tier].emoji).join('')}\n${d.depth.toLocaleString()} m — ${zone.name} (${d.points}/${max})`;
  shell(`
    <div class="card reveal pop">
      <div class="cat">${esc(title)} · surfaced</div>
      <div class="bigdepth">${d.depth.toLocaleString()} m</div>
      <div class="zone">You reached the ${zone.name}</div>
      <div class="grid-emoji">${d.results.map(r => TIERS[r.tier].emoji).join('')}</div>
      <div class="muted">${d.points} / ${max} points</div>
      <div class="log">${d.results.map(r => `<div><span>${esc(r.q)}<br><em>${r.answer ? esc(r.answer) : '—'}</em></span>${chip(r.tier)}</div>`).join('')}</div>
      <div class="row" style="margin-top:16px">
        <button id="share">Share</button>
        ${mode === 'daily' ? '' : `<button class="ghost" onclick="start('${mode}'${pack ? `,'${pack}'` : ''})">Dive again</button>`}
        <button class="ghost" onclick="home()">Home</button>
      </div>
      ${mode === 'daily' ? `<p class="small muted" id="cd" style="margin-bottom:0"></p>` : ''}
    </div>
    ${mode === 'daily' ? `<div class="card" style="margin-top:14px">${statsHtml(stats())}</div>` : ''}`);
  document.getElementById('share').onclick = async () => {
    try {
      if (navigator.share) await navigator.share({ text: share });
      else { await navigator.clipboard.writeText(share); toast('Copied to clipboard'); }
    } catch { /* cancelled */ }
  };
  if (mode === 'daily') {
    const cd = document.getElementById('cd');
    const tick = () => {
      if (!document.body.contains(cd)) return clearInterval(id);
      const now = new Date(), next = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + 1);
      const s = Math.floor((next - now) / 1000);
      cd.textContent = `Next dive in ${String(Math.floor(s / 3600)).padStart(2, '0')}:${String(Math.floor(s / 60) % 60).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    };
    const id = setInterval(tick, 1000); tick();
  }
}

buildGauge();
ambience();
home();
</script>
</body>
</html>
